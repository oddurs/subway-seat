playback_progress_bar_unfilled = { fg = "#9BA5B8", bg = "#ADB7CB" }
current_playing = { fg = "#357D41", modifiers = ["Bold"] }
page_desc = { fg = "#896800", modifiers = ["Bold"] }
playlist_desc = { fg = "#727781" }
table_header = { fg = "#9F591B" }
selection = { fg = "#1F2022", bg = "#C1CADC", modifiers = ["Bold"] }
