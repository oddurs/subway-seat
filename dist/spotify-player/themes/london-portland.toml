# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
[[themes]]
name = "london-portland"

[themes.palette]
background = "#E5EAF6"
foreground = "#2F3033"
black = "#434548"
red = "#A40005"
green = "#357D41"
yellow = "#896800"
blue = "#0019A8"
magenta = "#9F591B"
cyan = "#007376"
white = "#9BA5B8"
bright_black = "#727781"
bright_red = "#CA2822"
bright_green = "#398145"
bright_yellow = "#977300"
bright_blue = "#406BD0"
bright_magenta = "#AE672B"
bright_cyan = "#008689"
bright_white = "#ADB7CB"

[themes.component_style]
block_title = { fg = "#9F591B", modifiers = ["Bold"] }
border = { fg = "#9BA5B8" }
