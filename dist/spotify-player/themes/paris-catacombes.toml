# >>> subway-seat >>>
# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
[[themes]]
name = "paris-catacombes"

[themes.palette]
background = "#062017"
foreground = "#CFDED7"
black = "#13382A"
red = "#DA6058"
green = "#73C686"
yellow = "#EBC342"
blue = "#639BD5"
magenta = "#D78E3C"
cyan = "#6FB393"
white = "#B8CAC2"
bright_black = "#648576"
bright_red = "#EF796F"
bright_green = "#82D896"
bright_yellow = "#FBD664"
bright_blue = "#82B7EE"
bright_magenta = "#EEA85C"
bright_cyan = "#8ECFAF"
bright_white = "#E4EEE9"

[themes.component_style]
block_title = { fg = "#D78E3C", modifiers = ["Bold"] }
border = { fg = "#1E4738" }
playback_status = { fg = "#EBC342", modifiers = ["Bold"] }
playback_track = { fg = "#EBC342", modifiers = ["Bold"] }
playback_artists = { fg = "#D78E3C" }
playback_album = { fg = "#6FB393" }
playback_genres = { fg = "#648576", modifiers = ["Italic"] }
playback_metadata = { fg = "#9EB3AA" }
playback_progress_bar = { fg = "#D78E3C", bg = "#13382A" }
playback_progress_bar_unfilled = { fg = "#1E4738", bg = "#13382A" }
current_playing = { fg = "#73C686", modifiers = ["Bold"] }
page_desc = { fg = "#EBC342", modifiers = ["Bold"] }
playlist_desc = { fg = "#648576" }
table_header = { fg = "#D78E3C" }
selection = { fg = "#E4EEE9", bg = "#13382A", modifiers = ["Bold"] }
secondary_row = { bg = "#061811" }
like = { fg = "#EF796F" }
lyrics_played = { fg = "#648576" }
lyrics_playing = { fg = "#EBC342", modifiers = ["Bold"] }
visualization = { low = "#73C686", mid = "#EBC342", high = "#EF796F" }
