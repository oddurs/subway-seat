like = { fg = "#E7877B" }
lyrics_played = { fg = "#74857C" }
lyrics_playing = { fg = "#F1BF4B", modifiers = ["Bold"] }
visualization = { low = "#70CAA9", mid = "#F1BF4B", high = "#E7877B" }
