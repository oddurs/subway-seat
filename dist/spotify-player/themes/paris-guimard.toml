# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
[[themes]]
name = "paris-guimard"

[themes.palette]
background = "#212D27"
foreground = "#DAE0DC"
black = "#34453C"
red = "#CD6B63"
green = "#80C28E"
yellow = "#EBC168"
blue = "#709BC8"
magenta = "#D0914F"
cyan = "#7BB096"
white = "#C3CAC6"
bright_black = "#77847D"
bright_red = "#E1837A"
bright_green = "#8FD59E"
bright_yellow = "#FBD380"
bright_blue = "#8DB6E2"
bright_magenta = "#E7AB6D"
bright_cyan = "#98CCB2"
bright_white = "#EAEEEC"

[themes.component_style]
block_title = { fg = "#D0914F", modifiers = ["Bold"] }
border = { fg = "#42544B" }
playback_status = { fg = "#EBC168", modifiers = ["Bold"] }
playback_track = { fg = "#EBC168", modifiers = ["Bold"] }
playback_artists = { fg = "#D0914F" }
playback_album = { fg = "#7BB096" }
playback_genres = { fg = "#77847D", modifiers = ["Italic"] }
playback_metadata = { fg = "#ABB4AF" }
playback_progress_bar = { fg = "#D0914F", bg = "#34453C" }
playback_progress_bar_unfilled = { fg = "#42544B", bg = "#34453C" }
current_playing = { fg = "#80C28E", modifiers = ["Bold"] }
page_desc = { fg = "#EBC168", modifiers = ["Bold"] }
playlist_desc = { fg = "#77847D" }
table_header = { fg = "#D0914F" }
selection = { fg = "#EAEEEC", bg = "#34453C", modifiers = ["Bold"] }
secondary_row = { bg = "#1A231E" }
like = { fg = "#E1837A" }
lyrics_played = { fg = "#77847D" }
lyrics_playing = { fg = "#EBC168", modifiers = ["Bold"] }
visualization = { low = "#80C28E", mid = "#EBC168", high = "#E1837A" }
