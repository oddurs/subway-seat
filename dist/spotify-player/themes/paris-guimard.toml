# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
[[themes]]
name = "paris-guimard"

[themes.palette]
background = "#1E2E26"
foreground = "#D9E1DB"
black = "#30463B"
red = "#C7665B"
green = "#70CAA9"
yellow = "#F1BF4B"
blue = "#709BC8"
magenta = "#CA9245"
cyan = "#549B9F"
white = "#C2CBC5"
bright_black = "#74857C"
bright_red = "#E7877B"
bright_green = "#89DEBE"
bright_yellow = "#FFD57A"
bright_blue = "#8DB6E2"
bright_magenta = "#DFAA61"
bright_cyan = "#70B5B9"
bright_white = "#E9EEEC"

[themes.component_style]
