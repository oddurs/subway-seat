# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Carrelage for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#405b4f,bg=#c8dad1"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#856a00,#9b5d00},bg=#c8dad1]#[fg=#e2ede8,bg=#{?client_prefix,#856a00,#9b5d00},bold] #S #[fg=#{?client_prefix,#856a00,#9b5d00},bg=#c8dad1,nobold] "
set -g status-right "#[fg=#405b4f,bg=#c8dad1] %a %d %b #[fg=#16241e,bg=#9dc1b1] %H:%M #[bg=#c8dad1] #[fg=#a30013]█#[fg=#9b5d00]█#[fg=#856a00]█#[fg=#00823b]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#405b4f,bg=#c8dad1"
set -g window-status-current-style "fg=#16241e,bg=#9dc1b1"
set -g window-status-last-style "fg=#334a41,bg=#c8dad1"
set -g window-status-activity-style "fg=#9b5d00,bg=#c8dad1"
set -g window-status-bell-style "fg=#c82c2c,bg=#c8dad1,bold"
set -g window-status-format "#[fg=#5c8171,bg=#c8dad1] #I #[fg=#405b4f]#W#{?window_zoomed_flag,#[fg=#856a00] Z,} "
set -g window-status-current-format "#[fg=#e2ede8,bg=#856a00,bold] #I #[fg=#16241e,bg=#9dc1b1,nobold] #W#{?window_zoomed_flag,#[fg=#856a00] Z,} #[bg=#c8dad1]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#88af9e"
set -g pane-active-border-style "fg=#9b5d00"
set -g display-panes-colour "#759a8a"
set -g display-panes-active-colour "#9b5d00"
set -gq display-panes-border-style "fg=#88af9e"
set -gq pane-scrollbars-style "fg=#759a8a,bg=#c8dad1,width=1,pad=0"
set -gq pane-status-style "fg=#405b4f,bg=#c8dad1"
set -gq pane-status-current-style "fg=#16241e,bg=#c8dad1,underscore"
set -gq session-status-style "fg=#405b4f,bg=#c8dad1"
set -gq session-status-current-style "fg=#16241e,bg=#c8dad1,underscore"
set -gq cursor-colour "#9b5d00"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#16241e,bg=#9dc1b1"
set -g message-command-style "fg=#856a00,bg=#9dc1b1"
set -g mode-style "fg=#16241e,bg=#9dc1b1"
set -gq copy-mode-match-style "fg=#16241e,bg=#c6c6a2"
set -gq copy-mode-current-match-style "fg=#16241e,bg=#bea574,bold"
set -gq copy-mode-mark-style "fg=#e2ede8,bg=#b43586"
set -gq copy-mode-selection-style "fg=#16241e,bg=#9dc1b1"
set -gq copy-mode-position-style "fg=#e2ede8,bg=#9b5d00"
set -gq copy-mode-line-number-style "fg=#759a8a"
set -gq copy-mode-current-line-number-style "fg=#9b5d00"
set -gq copy-mode-current-line-style "bg=#d5e3dd"
set -gq prompt-cursor-colour "#9b5d00"
set -gq prompt-command-cursor-colour "#856a00"
set -g clock-mode-colour "#856a00"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#88af9e"
set -gq tree-mode-selection-style "fg=#16241e,bg=#9dc1b1"
set -gq switch-mode-match-style "fg=#16241e,bg=#c6c6a2,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#21352d,bg=#f0f6f4"
set -gq popup-border-style "fg=#9b5d00,bg=#f0f6f4"
set -gq menu-style "fg=#21352d,bg=#f0f6f4"
set -gq menu-selected-style "fg=#e2ede8,bg=#9b5d00"
set -gq menu-border-style "fg=#88af9e,bg=#f0f6f4"
