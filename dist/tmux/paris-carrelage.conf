# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Carrelage for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#45594f,bg=#bfddcd"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#8a6700,#754500},bg=#bfddcd]#[fg=#def0e6,bg=#{?client_prefix,#8a6700,#754500},bold] #S #[fg=#{?client_prefix,#8a6700,#754500},bg=#bfddcd,nobold] "
set -g status-right "#[fg=#45594f,bg=#bfddcd] %a %d %b #[fg=#18231d,bg=#96c4ac] %H:%M #[bg=#bfddcd] #[fg=#932d29]█#[fg=#754500]█#[fg=#8a6700]█#[fg=#207f41]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#45594f,bg=#bfddcd"
set -g window-status-current-style "fg=#18231d,bg=#96c4ac"
set -g window-status-last-style "fg=#374940,bg=#bfddcd"
set -g window-status-activity-style "fg=#754500,bg=#bfddcd"
set -g window-status-bell-style "fg=#bb403b,bg=#bfddcd,bold"
set -g window-status-format "#[fg=#627f70,bg=#bfddcd] #I #[fg=#45594f]#W#{?window_zoomed_flag,#[fg=#8a6700] Z,} "
set -g window-status-current-format "#[fg=#def0e6,bg=#8a6700,bold] #I #[fg=#18231d,bg=#96c4ac,nobold] #W#{?window_zoomed_flag,#[fg=#8a6700] Z,} #[bg=#bfddcd]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#84b09a"
set -g pane-active-border-style "fg=#754500"
set -g display-panes-colour "#769b87"
set -g display-panes-active-colour "#754500"
set -gq display-panes-border-style "fg=#84b09a"
set -gq pane-scrollbars-style "fg=#769b87,bg=#bfddcd,width=1,pad=0"
set -gq pane-status-style "fg=#45594f,bg=#bfddcd"
set -gq pane-status-current-style "fg=#18231d,bg=#bfddcd,underscore"
set -gq session-status-style "fg=#45594f,bg=#bfddcd"
set -gq session-status-current-style "fg=#18231d,bg=#bfddcd,underscore"
set -gq cursor-colour "#754500"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#18231d,bg=#96c4ac"
set -g message-command-style "fg=#8a6700,bg=#96c4ac"
set -g mode-style "fg=#18231d,bg=#96c4ac"
set -gq copy-mode-match-style "fg=#18231d,bg=#c5c7a1"
set -gq copy-mode-current-match-style "fg=#18231d,bg=#aa9a73,bold"
set -gq copy-mode-mark-style "fg=#def0e6,bg=#9a557d"
set -gq copy-mode-selection-style "fg=#18231d,bg=#96c4ac"
set -gq copy-mode-position-style "fg=#def0e6,bg=#754500"
set -gq copy-mode-line-number-style "fg=#769b87"
set -gq copy-mode-current-line-number-style "fg=#754500"
set -gq copy-mode-current-line-style "bg=#d0e6d8"
set -gq prompt-cursor-colour "#754500"
set -gq prompt-command-cursor-colour "#8a6700"
set -g clock-mode-colour "#8a6700"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#84b09a"
set -gq tree-mode-selection-style "fg=#18231d,bg=#96c4ac"
set -gq switch-mode-match-style "fg=#18231d,bg=#c5c7a1,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#25352c,bg=#eef8f2"
set -gq popup-border-style "fg=#754500,bg=#eef8f2"
set -gq menu-style "fg=#25352c,bg=#eef8f2"
set -gq menu-selected-style "fg=#def0e6,bg=#754500"
set -gq menu-border-style "fg=#84b09a,bg=#eef8f2"
