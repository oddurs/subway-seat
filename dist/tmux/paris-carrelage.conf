# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Carrelage for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#45594f,bg=#cad9d1"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#8a6700,#9b5d00},bg=#cad9d1]#[fg=#e4ede8,bg=#{?client_prefix,#8a6700,#9b5d00},bold] #S #[fg=#{?client_prefix,#8a6700,#9b5d00},bg=#cad9d1,nobold] "
set -g status-right "#[fg=#45594f,bg=#cad9d1] %a %d %b #[fg=#18231d,bg=#a3bfb0] %H:%M #[bg=#cad9d1] #[fg=#9e171b]█#[fg=#9b5d00]█#[fg=#8a6700]█#[fg=#18803f]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#45594f,bg=#cad9d1"
set -g window-status-current-style "fg=#18231d,bg=#a3bfb0"
set -g window-status-last-style "fg=#374940,bg=#cad9d1"
set -g window-status-activity-style "fg=#9b5d00,bg=#cad9d1"
set -g window-status-bell-style "fg=#bb403b,bg=#cad9d1,bold"
set -g window-status-format "#[fg=#627f70,bg=#cad9d1] #I #[fg=#45594f]#W#{?window_zoomed_flag,#[fg=#8a6700] Z,} "
set -g window-status-current-format "#[fg=#e4ede8,bg=#8a6700,bold] #I #[fg=#18231d,bg=#a3bfb0,nobold] #W#{?window_zoomed_flag,#[fg=#8a6700] Z,} #[bg=#cad9d1]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#8ead9d"
set -g pane-active-border-style "fg=#9b5d00"
set -g display-panes-colour "#7b9989"
set -g display-panes-active-colour "#9b5d00"
set -gq display-panes-border-style "fg=#8ead9d"
set -gq pane-scrollbars-style "fg=#7b9989,bg=#cad9d1,width=1,pad=0"
set -gq pane-status-style "fg=#45594f,bg=#cad9d1"
set -gq pane-status-current-style "fg=#18231d,bg=#cad9d1,underscore"
set -gq session-status-style "fg=#45594f,bg=#cad9d1"
set -gq session-status-current-style "fg=#18231d,bg=#cad9d1,underscore"
set -gq cursor-colour "#9b5d00"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#18231d,bg=#a3bfb0"
set -g message-command-style "fg=#8a6700,bg=#a3bfb0"
set -g mode-style "fg=#18231d,bg=#a3bfb0"
set -gq copy-mode-match-style "fg=#18231d,bg=#c9c5a2"
set -gq copy-mode-current-match-style "fg=#18231d,bg=#c0a574,bold"
set -gq copy-mode-mark-style "fg=#e4ede8,bg=#9a557d"
set -gq copy-mode-selection-style "fg=#18231d,bg=#a3bfb0"
set -gq copy-mode-position-style "fg=#e4ede8,bg=#9b5d00"
set -gq copy-mode-line-number-style "fg=#7b9989"
set -gq copy-mode-current-line-number-style "fg=#9b5d00"
set -gq copy-mode-current-line-style "bg=#d8e3dc"
set -gq prompt-cursor-colour "#9b5d00"
set -gq prompt-command-cursor-colour "#8a6700"
set -g clock-mode-colour "#8a6700"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#8ead9d"
set -gq tree-mode-selection-style "fg=#18231d,bg=#a3bfb0"
set -gq switch-mode-match-style "fg=#18231d,bg=#c9c5a2,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#25352c,bg=#f2f6f4"
set -gq popup-border-style "fg=#9b5d00,bg=#f2f6f4"
set -gq menu-style "fg=#25352c,bg=#f2f6f4"
set -gq menu-selected-style "fg=#e4ede8,bg=#9b5d00"
set -gq menu-border-style "fg=#8ead9d,bg=#f2f6f4"
