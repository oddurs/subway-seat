# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Carrelage for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#45594f,bg=#c8e0d3"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#8a6700,#754500},bg=#c8e0d3]#[fg=#e7f5ed,bg=#{?client_prefix,#8a6700,#754500},bold] #S #[fg=#{?client_prefix,#8a6700,#754500},bg=#c8e0d3,nobold] "
set -g status-right "#[fg=#45594f,bg=#c8e0d3] %a %d %b #[fg=#18231d,bg=#9fc6b1] %H:%M #[bg=#c8e0d3] #[fg=#932d29]█#[fg=#754500]█#[fg=#8a6700]█#[fg=#207f41]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#45594f,bg=#c8e0d3"
set -g window-status-current-style "fg=#18231d,bg=#9fc6b1"
set -g window-status-last-style "fg=#374940,bg=#c8e0d3"
set -g window-status-activity-style "fg=#754500,bg=#c8e0d3"
set -g window-status-bell-style "fg=#bb403b,bg=#c8e0d3,bold"
set -g window-status-format "#[fg=#627f70,bg=#c8e0d3] #I #[fg=#45594f]#W#{?window_zoomed_flag,#[fg=#8a6700] Z,} "
set -g window-status-current-format "#[fg=#e7f5ed,bg=#8a6700,bold] #I #[fg=#18231d,bg=#9fc6b1,nobold] #W#{?window_zoomed_flag,#[fg=#8a6700] Z,} #[bg=#c8e0d3]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#89b19d"
set -g pane-active-border-style "fg=#754500"
set -g display-panes-colour "#789c88"
set -g display-panes-active-colour "#754500"
set -gq display-panes-border-style "fg=#89b19d"
set -gq pane-scrollbars-style "fg=#789c88,bg=#c8e0d3,width=1,pad=0"
set -gq pane-status-style "fg=#45594f,bg=#c8e0d3"
set -gq pane-status-current-style "fg=#18231d,bg=#c8e0d3,underscore"
set -gq session-status-style "fg=#45594f,bg=#c8e0d3"
set -gq session-status-current-style "fg=#18231d,bg=#c8e0d3,underscore"
set -gq cursor-colour "#754500"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#18231d,bg=#9fc6b1"
set -g message-command-style "fg=#8a6700,bg=#9fc6b1"
set -g mode-style "fg=#18231d,bg=#9fc6b1"
set -gq copy-mode-match-style "fg=#18231d,bg=#cbcaa6"
set -gq copy-mode-current-match-style "fg=#18231d,bg=#ae9d76,bold"
set -gq copy-mode-mark-style "fg=#e7f5ed,bg=#9a557d"
set -gq copy-mode-selection-style "fg=#18231d,bg=#9fc6b1"
set -gq copy-mode-position-style "fg=#e7f5ed,bg=#754500"
set -gq copy-mode-line-number-style "fg=#789c88"
set -gq copy-mode-current-line-number-style "fg=#754500"
set -gq copy-mode-current-line-style "bg=#d8eadf"
set -gq prompt-cursor-colour "#754500"
set -gq prompt-command-cursor-colour "#8a6700"
set -g clock-mode-colour "#8a6700"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#89b19d"
set -gq tree-mode-selection-style "fg=#18231d,bg=#9fc6b1"
set -gq switch-mode-match-style "fg=#18231d,bg=#cbcaa6,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#25352c,bg=#f3faf6"
set -gq popup-border-style "fg=#754500,bg=#f3faf6"
set -gq menu-style "fg=#25352c,bg=#f3faf6"
set -gq menu-selected-style "fg=#e7f5ed,bg=#754500"
set -gq menu-border-style "fg=#89b19d,bg=#f3faf6"
