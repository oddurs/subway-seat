# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Carrelage for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#4c574d,bg=#d4dcd3"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#8e6b08,#804b00},bg=#d4dcd3]#[fg=#eef3ed,bg=#{?client_prefix,#8e6b08,#804b00},bold] #S #[fg=#{?client_prefix,#8e6b08,#804b00},bg=#d4dcd3,nobold] "
set -g status-right "#[fg=#4c574d,bg=#d4dcd3] %a %d %b #[fg=#1b221c,bg=#b1c0b0] %H:%M #[bg=#d4dcd3] #[fg=#932d29]█#[fg=#804b00]█#[fg=#8e6b08]█#[fg=#207f41]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#4c574d,bg=#d4dcd3"
set -g window-status-current-style "fg=#1b221c,bg=#b1c0b0"
set -g window-status-last-style "fg=#3d473e,bg=#d4dcd3"
set -g window-status-activity-style "fg=#804b00,bg=#d4dcd3"
set -g window-status-bell-style "fg=#be423d,bg=#d4dcd3,bold"
set -g window-status-format "#[fg=#6e7c6e,bg=#d4dcd3] #I #[fg=#4c574d]#W#{?window_zoomed_flag,#[fg=#8e6b08] Z,} "
set -g window-status-current-format "#[fg=#eef3ed,bg=#8e6b08,bold] #I #[fg=#1b221c,bg=#b1c0b0,nobold] #W#{?window_zoomed_flag,#[fg=#8e6b08] Z,} #[bg=#d4dcd3]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#9bac9a"
set -g pane-active-border-style "fg=#804b00"
set -g display-panes-colour "#879887"
set -g display-panes-active-colour "#804b00"
set -gq display-panes-border-style "fg=#9bac9a"
set -gq pane-scrollbars-style "fg=#879887,bg=#d4dcd3,width=1,pad=0"
set -gq pane-status-style "fg=#4c574d,bg=#d4dcd3"
set -gq pane-status-current-style "fg=#1b221c,bg=#d4dcd3,underscore"
set -gq session-status-style "fg=#4c574d,bg=#d4dcd3"
set -gq session-status-current-style "fg=#1b221c,bg=#d4dcd3,underscore"
set -gq cursor-colour "#804b00"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#1b221c,bg=#b1c0b0"
set -g message-command-style "fg=#8e6b08,bg=#b1c0b0"
set -g mode-style "fg=#1b221c,bg=#b1c0b0"
set -gq copy-mode-match-style "fg=#1b221c,bg=#d1caa8"
set -gq copy-mode-current-match-style "fg=#1b221c,bg=#b79f76,bold"
set -gq copy-mode-mark-style "fg=#eef3ed,bg=#98547c"
set -gq copy-mode-selection-style "fg=#1b221c,bg=#b1c0b0"
set -gq copy-mode-position-style "fg=#eef3ed,bg=#804b00"
set -gq copy-mode-line-number-style "fg=#879887"
set -gq copy-mode-current-line-number-style "fg=#804b00"
set -gq copy-mode-current-line-style "bg=#e1e7e0"
set -gq prompt-cursor-colour "#804b00"
set -gq prompt-command-cursor-colour "#8e6b08"
set -g clock-mode-colour "#8e6b08"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#9bac9a"
set -gq tree-mode-selection-style "fg=#1b221c,bg=#b1c0b0"
set -gq switch-mode-match-style "fg=#1b221c,bg=#d1caa8,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#2a342b,bg=#f6f9f6"
set -gq popup-border-style "fg=#804b00,bg=#f6f9f6"
set -gq menu-style "fg=#2a342b,bg=#f6f9f6"
set -gq menu-selected-style "fg=#eef3ed,bg=#804b00"
set -gq menu-border-style "fg=#9bac9a,bg=#f6f9f6"
