# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Subway Seat Enamel for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#654f3b,bg=#e2d3b6"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#a56e00,#c4561a},bg=#e2d3b6]#[fg=#f4e9d4,bg=#{?client_prefix,#a56e00,#c4561a},bold] #S #[fg=#{?client_prefix,#a56e00,#c4561a},bg=#e2d3b6,nobold] "
set -g status-right "#[fg=#654f3b,bg=#e2d3b6] %a %d %b #[fg=#2a1d13,bg=#cab48e] %H:%M #[bg=#e2d3b6] #[fg=#b43b27]█#[fg=#c4561a]█#[fg=#a56e00]█#[fg=#697813]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#654f3b,bg=#e2d3b6"
set -g window-status-current-style "fg=#2a1d13,bg=#cab48e"
set -g window-status-last-style "fg=#54402f,bg=#e2d3b6"
set -g window-status-activity-style "fg=#c4561a,bg=#e2d3b6"
set -g window-status-bell-style "fg=#c44a33,bg=#e2d3b6,bold"
set -g window-status-format "#[fg=#8c7254,bg=#e2d3b6] #I #[fg=#654f3b]#W#{?window_zoomed_flag,#[fg=#a56e00] Z,} "
set -g window-status-current-format "#[fg=#f4e9d4,bg=#a56e00,bold] #I #[fg=#2a1d13,bg=#cab48e,nobold] #W#{?window_zoomed_flag,#[fg=#a56e00] Z,} #[bg=#e2d3b6]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#baa07a"
set -g pane-active-border-style "fg=#c4561a"
set -g display-panes-colour "#a58c6a"
set -g display-panes-active-colour "#c4561a"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#2a1d13,bg=#cab48e"
set -g message-command-style "fg=#a56e00,bg=#cab48e"
set -g mode-style "fg=#2a1d13,bg=#cab48e"
set -gq copy-mode-match-style "fg=#2a1d13,bg=#e0ca9e"
set -gq copy-mode-current-match-style "fg=#2a1d13,bg=#e0ab85,bold"
set -gq copy-mode-mark-style "fg=#f4e9d4,bg=#ae5f3a"
set -g clock-mode-colour "#a56e00"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#3e2c1e,bg=#f4e9d4"
set -gq popup-border-style "fg=#c4561a"
set -gq menu-style "fg=#3e2c1e,bg=#e2d3b6"
set -gq menu-selected-style "fg=#f4e9d4,bg=#c4561a"
set -gq menu-border-style "fg=#baa07a"
