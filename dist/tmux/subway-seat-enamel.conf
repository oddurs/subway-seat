# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Subway Seat Enamel for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#654f3b,bg=#e2d3b6"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#936200,#ad4e00},bg=#e2d3b6]#[fg=#f4e9d4,bg=#{?client_prefix,#936200,#ad4e00},bold] #S #[fg=#{?client_prefix,#936200,#ad4e00},bg=#e2d3b6,nobold] "
set -g status-right "#[fg=#654f3b,bg=#e2d3b6] %a %d %b #[fg=#2a1d13,bg=#cab48e] %H:%M #[bg=#e2d3b6] #[fg=#992418]█#[fg=#ad4e00]█#[fg=#936200]█#[fg=#66740f]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#654f3b,bg=#e2d3b6"
set -g window-status-current-style "fg=#2a1d13,bg=#cab48e"
set -g window-status-last-style "fg=#54402f,bg=#e2d3b6"
set -g window-status-activity-style "fg=#ad4e00,bg=#e2d3b6"
set -g window-status-bell-style "fg=#bc4031,bg=#e2d3b6,bold"
set -g window-status-format "#[fg=#8c7254,bg=#e2d3b6] #I #[fg=#654f3b]#W#{?window_zoomed_flag,#[fg=#936200] Z,} "
set -g window-status-current-format "#[fg=#f4e9d4,bg=#936200,bold] #I #[fg=#2a1d13,bg=#cab48e,nobold] #W#{?window_zoomed_flag,#[fg=#936200] Z,} #[bg=#e2d3b6]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#baa07a"
set -g pane-active-border-style "fg=#ad4e00"
set -g display-panes-colour "#a58c6a"
set -g display-panes-active-colour "#ad4e00"
set -gq display-panes-border-style "fg=#baa07a"
set -gq pane-scrollbars-style "fg=#a58c6a,bg=#e2d3b6,width=1,pad=0"
set -gq pane-status-style "fg=#654f3b,bg=#e2d3b6"
set -gq pane-status-current-style "fg=#2a1d13,bg=#e2d3b6,underscore"
set -gq session-status-style "fg=#654f3b,bg=#e2d3b6"
set -gq session-status-current-style "fg=#2a1d13,bg=#e2d3b6,underscore"
set -gq cursor-colour "#ad4e00"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#2a1d13,bg=#cab48e"
set -g message-command-style "fg=#936200,bg=#cab48e"
set -g mode-style "fg=#2a1d13,bg=#cab48e"
set -gq copy-mode-match-style "fg=#2a1d13,bg=#d7c094"
set -gq copy-mode-current-match-style "fg=#2a1d13,bg=#d09c6a,bold"
set -gq copy-mode-mark-style "fg=#f4e9d4,bg=#a65633"
set -gq copy-mode-selection-style "fg=#2a1d13,bg=#cab48e"
set -gq copy-mode-position-style "fg=#f4e9d4,bg=#ad4e00"
set -gq copy-mode-line-number-style "fg=#a58c6a"
set -gq copy-mode-current-line-number-style "fg=#ad4e00"
set -gq copy-mode-current-line-style "bg=#ebdec6"
set -gq prompt-cursor-colour "#ad4e00"
set -gq prompt-command-cursor-colour "#936200"
set -g clock-mode-colour "#936200"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#baa07a"
set -gq tree-mode-selection-style "fg=#2a1d13,bg=#cab48e"
set -gq switch-mode-match-style "fg=#2a1d13,bg=#d7c094,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#3e2c1e,bg=#faf4ea"
set -gq popup-border-style "fg=#ad4e00,bg=#faf4ea"
set -gq menu-style "fg=#3e2c1e,bg=#faf4ea"
set -gq menu-selected-style "fg=#f4e9d4,bg=#ad4e00"
set -gq menu-border-style "fg=#baa07a,bg=#faf4ea"
