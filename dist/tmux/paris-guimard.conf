# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Guimard for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#a9b5ae,bg=#18241d"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#f2bf4b,#d0914f},bg=#18241d]#[fg=#131a17,bg=#{?client_prefix,#f2bf4b,#d0914f},bold] #S #[fg=#{?client_prefix,#f2bf4b,#d0914f},bg=#18241d,nobold] "
set -g status-right "#[fg=#a9b5ae,bg=#18241d] %a %d %b #[fg=#e9eeec,bg=#30463b] %H:%M #[bg=#18241d] #[fg=#cd6b63]█#[fg=#d0914f]█#[fg=#f2bf4b]█#[fg=#80c28e]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#a9b5ae,bg=#18241d"
set -g window-status-current-style "fg=#e9eeec,bg=#30463b"
set -g window-status-last-style "fg=#c2cbc5,bg=#18241d"
set -g window-status-activity-style "fg=#d0914f,bg=#18241d"
set -g window-status-bell-style "fg=#e1837a,bg=#18241d,bold"
set -g window-status-format "#[fg=#74857c,bg=#18241d] #I #[fg=#a9b5ae]#W#{?window_zoomed_flag,#[fg=#f2bf4b] Z,} "
set -g window-status-current-format "#[fg=#131a17,bg=#f2bf4b,bold] #I #[fg=#e9eeec,bg=#30463b,nobold] #W#{?window_zoomed_flag,#[fg=#f2bf4b] Z,} #[bg=#18241d]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#30463b"
set -g pane-active-border-style "fg=#d0914f"
set -g display-panes-colour "#586b61"
set -g display-panes-active-colour "#d0914f"
set -gq display-panes-border-style "fg=#30463b"
set -gq pane-scrollbars-style "fg=#586b61,bg=#18241d,width=1,pad=0"
set -gq pane-status-style "fg=#a9b5ae,bg=#18241d"
set -gq pane-status-current-style "fg=#e9eeec,bg=#18241d,underscore"
set -gq session-status-style "fg=#a9b5ae,bg=#18241d"
set -gq session-status-current-style "fg=#e9eeec,bg=#18241d,underscore"
set -gq cursor-colour "#f2bf4b"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#e9eeec,bg=#30463b"
set -g message-command-style "fg=#f2bf4b,bg=#30463b"
set -g mode-style "fg=#e9eeec,bg=#3e554a"
set -gq copy-mode-match-style "fg=#e9eeec,bg=#5e5a31"
set -gq copy-mode-current-match-style "fg=#e9eeec,bg=#77603a,bold"
set -gq copy-mode-mark-style "fg=#131a17,bg=#ce96b4"
set -gq copy-mode-selection-style "fg=#e9eeec,bg=#3e554a"
set -gq copy-mode-position-style "fg=#131a17,bg=#d0914f"
set -gq copy-mode-line-number-style "fg=#586b61"
set -gq copy-mode-current-line-number-style "fg=#f2bf4b"
set -gq copy-mode-current-line-style "bg=#263930"
set -gq prompt-cursor-colour "#f2bf4b"
set -gq prompt-command-cursor-colour "#d0914f"
set -g clock-mode-colour "#f2bf4b"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#30463b"
set -gq tree-mode-selection-style "fg=#e9eeec,bg=#3e554a"
set -gq switch-mode-match-style "fg=#e9eeec,bg=#5e5a31,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#d9e1db,bg=#263930"
set -gq popup-border-style "fg=#d0914f,bg=#263930"
set -gq menu-style "fg=#d9e1db,bg=#263930"
set -gq menu-selected-style "fg=#131a17,bg=#d0914f"
set -gq menu-border-style "fg=#3e554a,bg=#263930"
