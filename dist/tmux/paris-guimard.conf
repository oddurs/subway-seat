# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Guimard for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#a2b7ae,bg=#0c261c"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#ebc342,#d78e3c},bg=#0c261c]#[fg=#0a1d15,bg=#{?client_prefix,#ebc342,#d78e3c},bold] #S #[fg=#{?client_prefix,#ebc342,#d78e3c},bg=#0c261c,nobold] "
set -g status-right "#[fg=#a2b7ae,bg=#0c261c] %a %d %b #[fg=#e6f0eb,bg=#194a39] %H:%M #[bg=#0c261c] #[fg=#da6058]█#[fg=#d78e3c]█#[fg=#ebc342]█#[fg=#73c686]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#a2b7ae,bg=#0c261c"
set -g window-status-current-style "fg=#e6f0eb,bg=#194a39"
set -g window-status-last-style "fg=#bbcdc5,bg=#0c261c"
set -g window-status-activity-style "fg=#d78e3c,bg=#0c261c"
set -g window-status-bell-style "fg=#ef796f,bg=#0c261c,bold"
set -g window-status-format "#[fg=#67897a,bg=#0c261c] #I #[fg=#a2b7ae]#W#{?window_zoomed_flag,#[fg=#ebc342] Z,} "
set -g window-status-current-format "#[fg=#0a1d15,bg=#ebc342,bold] #I #[fg=#e6f0eb,bg=#194a39,nobold] #W#{?window_zoomed_flag,#[fg=#ebc342] Z,} #[bg=#0c261c]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#194a39"
set -g pane-active-border-style "fg=#d78e3c"
set -g display-panes-colour "#47705f"
set -g display-panes-active-colour "#d78e3c"
set -gq display-panes-border-style "fg=#194a39"
set -gq pane-scrollbars-style "fg=#47705f,bg=#0c261c,width=1,pad=0"
set -gq pane-status-style "fg=#a2b7ae,bg=#0c261c"
set -gq pane-status-current-style "fg=#e6f0eb,bg=#0c261c,underscore"
set -gq session-status-style "fg=#a2b7ae,bg=#0c261c"
set -gq session-status-current-style "fg=#e6f0eb,bg=#0c261c,underscore"
set -gq cursor-colour "#ebc342"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#e6f0eb,bg=#194a39"
set -g message-command-style "fg=#ebc342,bg=#194a39"
set -g mode-style "fg=#e6f0eb,bg=#285a47"
set -gq copy-mode-match-style "fg=#e6f0eb,bg=#505d2e"
set -gq copy-mode-current-match-style "fg=#e6f0eb,bg=#726030,bold"
set -gq copy-mode-mark-style "fg=#0a1d15,bg=#e783bd"
set -gq copy-mode-selection-style "fg=#e6f0eb,bg=#285a47"
set -gq copy-mode-position-style "fg=#0a1d15,bg=#d78e3c"
set -gq copy-mode-line-number-style "fg=#47705f"
set -gq copy-mode-current-line-number-style "fg=#ebc342"
set -gq copy-mode-current-line-style "bg=#113e2e"
set -gq prompt-cursor-colour "#ebc342"
set -gq prompt-command-cursor-colour "#d78e3c"
set -g clock-mode-colour "#ebc342"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#194a39"
set -gq tree-mode-selection-style "fg=#e6f0eb,bg=#285a47"
set -gq switch-mode-match-style "fg=#e6f0eb,bg=#505d2e,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#d3e2db,bg=#113e2e"
set -gq popup-border-style "fg=#d78e3c,bg=#113e2e"
set -gq menu-style "fg=#d3e2db,bg=#113e2e"
set -gq menu-selected-style "fg=#0a1d15,bg=#d78e3c"
set -gq menu-border-style "fg=#285a47,bg=#113e2e"
