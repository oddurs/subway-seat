# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Guimard for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#abb4af,bg=#1a231e"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#ebc168,#d0914f},bg=#1a231e]#[fg=#141a17,bg=#{?client_prefix,#ebc168,#d0914f},bold] #S #[fg=#{?client_prefix,#ebc168,#d0914f},bg=#1a231e,nobold] "
set -g status-right "#[fg=#abb4af,bg=#1a231e] %a %d %b #[fg=#eaeeec,bg=#34453c] %H:%M #[bg=#1a231e] #[fg=#cd6b63]█#[fg=#d0914f]█#[fg=#ebc168]█#[fg=#80c28e]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#abb4af,bg=#1a231e"
set -g window-status-current-style "fg=#eaeeec,bg=#34453c"
set -g window-status-last-style "fg=#c3cac6,bg=#1a231e"
set -g window-status-activity-style "fg=#d0914f,bg=#1a231e"
set -g window-status-bell-style "fg=#e1837a,bg=#1a231e,bold"
set -g window-status-format "#[fg=#77847d,bg=#1a231e] #I #[fg=#abb4af]#W#{?window_zoomed_flag,#[fg=#ebc168] Z,} "
set -g window-status-current-format "#[fg=#141a17,bg=#ebc168,bold] #I #[fg=#eaeeec,bg=#34453c,nobold] #W#{?window_zoomed_flag,#[fg=#ebc168] Z,} #[bg=#1a231e]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#34453c"
set -g pane-active-border-style "fg=#d0914f"
set -g display-panes-colour "#5b6a62"
set -g display-panes-active-colour "#d0914f"
set -gq display-panes-border-style "fg=#34453c"
set -gq pane-scrollbars-style "fg=#5b6a62,bg=#1a231e,width=1,pad=0"
set -gq pane-status-style "fg=#abb4af,bg=#1a231e"
set -gq pane-status-current-style "fg=#eaeeec,bg=#1a231e,underscore"
set -gq session-status-style "fg=#abb4af,bg=#1a231e"
set -gq session-status-current-style "fg=#eaeeec,bg=#1a231e,underscore"
set -gq cursor-colour "#ebc168"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#eaeeec,bg=#34453c"
set -g message-command-style "fg=#ebc168,bg=#34453c"
set -g mode-style "fg=#eaeeec,bg=#42544b"
set -gq copy-mode-match-style "fg=#eaeeec,bg=#5e593a"
set -gq copy-mode-current-match-style "fg=#eaeeec,bg=#785f3b,bold"
set -gq copy-mode-mark-style "fg=#141a17,bg=#ce96b4"
set -gq copy-mode-selection-style "fg=#eaeeec,bg=#42544b"
set -gq copy-mode-position-style "fg=#141a17,bg=#d0914f"
set -gq copy-mode-line-number-style "fg=#5b6a62"
set -gq copy-mode-current-line-number-style "fg=#ebc168"
set -gq copy-mode-current-line-style "bg=#2a3831"
set -gq prompt-cursor-colour "#ebc168"
set -gq prompt-command-cursor-colour "#d0914f"
set -g clock-mode-colour "#ebc168"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#34453c"
set -gq tree-mode-selection-style "fg=#eaeeec,bg=#42544b"
set -gq switch-mode-match-style "fg=#eaeeec,bg=#5e593a,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#dae0dc,bg=#2a3831"
set -gq popup-border-style "fg=#d0914f,bg=#2a3831"
set -gq menu-style "fg=#dae0dc,bg=#2a3831"
set -gq menu-selected-style "fg=#141a17,bg=#d0914f"
set -gq menu-border-style "fg=#42544b,bg=#2a3831"
