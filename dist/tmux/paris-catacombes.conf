# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Catacombes for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#9eb3aa,bg=#061811"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#ebc342,#d78e3c},bg=#061811]#[fg=#05120c,bg=#{?client_prefix,#ebc342,#d78e3c},bold] #S #[fg=#{?client_prefix,#ebc342,#d78e3c},bg=#061811,nobold] "
set -g status-right "#[fg=#9eb3aa,bg=#061811] %a %d %b #[fg=#e4eee9,bg=#13382a] %H:%M #[bg=#061811] #[fg=#da6058]█#[fg=#d78e3c]█#[fg=#ebc342]█#[fg=#73c686]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#9eb3aa,bg=#061811"
set -g window-status-current-style "fg=#e4eee9,bg=#13382a"
set -g window-status-last-style "fg=#b8cac2,bg=#061811"
set -g window-status-activity-style "fg=#d78e3c,bg=#061811"
set -g window-status-bell-style "fg=#ef796f,bg=#061811,bold"
set -g window-status-format "#[fg=#648576,bg=#061811] #I #[fg=#9eb3aa]#W#{?window_zoomed_flag,#[fg=#ebc342] Z,} "
set -g window-status-current-format "#[fg=#05120c,bg=#ebc342,bold] #I #[fg=#e4eee9,bg=#13382a,nobold] #W#{?window_zoomed_flag,#[fg=#ebc342] Z,} #[bg=#061811]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#13382a"
set -g pane-active-border-style "fg=#d78e3c"
set -g display-panes-colour "#456a5b"
set -g display-panes-active-colour "#d78e3c"
set -gq display-panes-border-style "fg=#13382a"
set -gq pane-scrollbars-style "fg=#456a5b,bg=#061811,width=1,pad=0"
set -gq pane-status-style "fg=#9eb3aa,bg=#061811"
set -gq pane-status-current-style "fg=#e4eee9,bg=#061811,underscore"
set -gq session-status-style "fg=#9eb3aa,bg=#061811"
set -gq session-status-current-style "fg=#e4eee9,bg=#061811,underscore"
set -gq cursor-colour "#ebc342"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#e4eee9,bg=#13382a"
set -g message-command-style "fg=#ebc342,bg=#13382a"
set -g mode-style "fg=#e4eee9,bg=#1e4738"
set -gq copy-mode-match-style "fg=#e4eee9,bg=#4b5124"
set -gq copy-mode-current-match-style "fg=#e4eee9,bg=#6e572a,bold"
set -gq copy-mode-mark-style "fg=#05120c,bg=#e783bd"
set -gq copy-mode-selection-style "fg=#e4eee9,bg=#1e4738"
set -gq copy-mode-position-style "fg=#05120c,bg=#d78e3c"
set -gq copy-mode-line-number-style "fg=#456a5b"
set -gq copy-mode-current-line-number-style "fg=#ebc342"
set -gq copy-mode-current-line-style "bg=#0a2b20"
set -gq prompt-cursor-colour "#ebc342"
set -gq prompt-command-cursor-colour "#d78e3c"
set -g clock-mode-colour "#ebc342"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#13382a"
set -gq tree-mode-selection-style "fg=#e4eee9,bg=#1e4738"
set -gq switch-mode-match-style "fg=#e4eee9,bg=#4b5124,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#cfded7,bg=#0a2b20"
set -gq popup-border-style "fg=#d78e3c,bg=#0a2b20"
set -gq menu-style "fg=#cfded7,bg=#0a2b20"
set -gq menu-selected-style "fg=#05120c,bg=#d78e3c"
set -gq menu-border-style "fg=#1e4738,bg=#0a2b20"
