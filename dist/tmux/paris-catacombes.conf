# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Catacombes for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#a7b0ab,bg=#0f1612"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#ebc168,#d0914f},bg=#0f1612]#[fg=#0b100d,bg=#{?client_prefix,#ebc168,#d0914f},bold] #S #[fg=#{?client_prefix,#ebc168,#d0914f},bg=#0f1612,nobold] "
set -g status-right "#[fg=#a7b0ab,bg=#0f1612] %a %d %b #[fg=#e8ecea,bg=#27332d] %H:%M #[bg=#0f1612] #[fg=#cd6b63]█#[fg=#d0914f]█#[fg=#ebc168]█#[fg=#80c28e]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#a7b0ab,bg=#0f1612"
set -g window-status-current-style "fg=#e8ecea,bg=#27332d"
set -g window-status-last-style "fg=#c0c7c3,bg=#0f1612"
set -g window-status-activity-style "fg=#d0914f,bg=#0f1612"
set -g window-status-bell-style "fg=#e1837a,bg=#0f1612,bold"
set -g window-status-format "#[fg=#738079,bg=#0f1612] #I #[fg=#a7b0ab]#W#{?window_zoomed_flag,#[fg=#ebc168] Z,} "
set -g window-status-current-format "#[fg=#0b100d,bg=#ebc168,bold] #I #[fg=#e8ecea,bg=#27332d,nobold] #W#{?window_zoomed_flag,#[fg=#ebc168] Z,} #[bg=#0f1612]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#27332d"
set -g pane-active-border-style "fg=#d0914f"
set -g display-panes-colour "#57645d"
set -g display-panes-active-colour "#d0914f"
set -gq display-panes-border-style "fg=#27332d"
set -gq pane-scrollbars-style "fg=#57645d,bg=#0f1612,width=1,pad=0"
set -gq pane-status-style "fg=#a7b0ab,bg=#0f1612"
set -gq pane-status-current-style "fg=#e8ecea,bg=#0f1612,underscore"
set -gq session-status-style "fg=#a7b0ab,bg=#0f1612"
set -gq session-status-current-style "fg=#e8ecea,bg=#0f1612,underscore"
set -gq cursor-colour "#ebc168"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#e8ecea,bg=#27332d"
set -g message-command-style "fg=#ebc168,bg=#27332d"
set -g mode-style "fg=#e8ecea,bg=#34423b"
set -gq copy-mode-match-style "fg=#e8ecea,bg=#544e31"
set -gq copy-mode-current-match-style "fg=#e8ecea,bg=#725734,bold"
set -gq copy-mode-mark-style "fg=#0b100d,bg=#ce96b4"
set -gq copy-mode-selection-style "fg=#e8ecea,bg=#34423b"
set -gq copy-mode-position-style "fg=#0b100d,bg=#d0914f"
set -gq copy-mode-line-number-style "fg=#57645d"
set -gq copy-mode-current-line-number-style "fg=#ebc168"
set -gq copy-mode-current-line-style "bg=#1d2822"
set -gq prompt-cursor-colour "#ebc168"
set -gq prompt-command-cursor-colour "#d0914f"
set -g clock-mode-colour "#ebc168"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#27332d"
set -gq tree-mode-selection-style "fg=#e8ecea,bg=#34423b"
set -gq switch-mode-match-style "fg=#e8ecea,bg=#544e31,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#d5dcd8,bg=#1d2822"
set -gq popup-border-style "fg=#d0914f,bg=#1d2822"
set -gq menu-style "fg=#d5dcd8,bg=#1d2822"
set -gq menu-selected-style "fg=#0b100d,bg=#d0914f"
set -gq menu-border-style "fg=#34423b,bg=#1d2822"
