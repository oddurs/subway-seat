# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# London Portland for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#4a5469,bg=#cdd5e4"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#896800,#b14a07},bg=#cdd5e4]#[fg=#e5eaf4,bg=#{?client_prefix,#896800,#b14a07},bold] #S #[fg=#{?client_prefix,#896800,#b14a07},bg=#cdd5e4,nobold] "
set -g status-right "#[fg=#4a5469,bg=#cdd5e4] %a %d %b #[fg=#1b202b,bg=#a9b7d4] %H:%M #[bg=#cdd5e4] #[fg=#9b211a]█#[fg=#b14a07]█#[fg=#896800]█#[fg=#0d8131]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#4a5469,bg=#cdd5e4"
set -g window-status-current-style "fg=#1b202b,bg=#a9b7d4"
set -g window-status-last-style "fg=#3c4557,bg=#cdd5e4"
set -g window-status-activity-style "fg=#b14a07,bg=#cdd5e4"
set -g window-status-bell-style "fg=#c92b23,bg=#cdd5e4,bold"
set -g window-status-format "#[fg=#697794,bg=#cdd5e4] #I #[fg=#4a5469]#W#{?window_zoomed_flag,#[fg=#896800] Z,} "
set -g window-status-current-format "#[fg=#e5eaf4,bg=#896800,bold] #I #[fg=#1b202b,bg=#a9b7d4,nobold] #W#{?window_zoomed_flag,#[fg=#896800] Z,} #[bg=#cdd5e4]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#95a5c4"
set -g pane-active-border-style "fg=#b14a07"
set -g display-panes-colour "#8291ae"
set -g display-panes-active-colour "#b14a07"
set -gq display-panes-border-style "fg=#95a5c4"
set -gq pane-scrollbars-style "fg=#8291ae,bg=#cdd5e4,width=1,pad=0"
set -gq pane-status-style "fg=#4a5469,bg=#cdd5e4"
set -gq pane-status-current-style "fg=#1b202b,bg=#cdd5e4,underscore"
set -gq session-status-style "fg=#4a5469,bg=#cdd5e4"
set -gq session-status-current-style "fg=#1b202b,bg=#cdd5e4,underscore"
set -gq cursor-colour "#b14a07"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#1b202b,bg=#a9b7d4"
set -g message-command-style "fg=#896800,bg=#a9b7d4"
set -g mode-style "fg=#1b202b,bg=#a9b7d4"
set -gq copy-mode-match-style "fg=#1b202b,bg=#c9c3ab"
set -gq copy-mode-current-match-style "fg=#1b202b,bg=#cb9a7e,bold"
set -gq copy-mode-mark-style "fg=#e5eaf4,bg=#7660ab"
set -gq copy-mode-selection-style "fg=#1b202b,bg=#a9b7d4"
set -gq copy-mode-position-style "fg=#e5eaf4,bg=#b14a07"
set -gq copy-mode-line-number-style "fg=#8291ae"
set -gq copy-mode-current-line-number-style "fg=#b14a07"
set -gq copy-mode-current-line-style "bg=#dae0eb"
set -gq prompt-cursor-colour "#b14a07"
set -gq prompt-command-cursor-colour "#896800"
set -g clock-mode-colour "#896800"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#95a5c4"
set -gq tree-mode-selection-style "fg=#1b202b,bg=#a9b7d4"
set -gq switch-mode-match-style "fg=#1b202b,bg=#c9c3ab,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#293040,bg=#f2f4fa"
set -gq popup-border-style "fg=#b14a07,bg=#f2f4fa"
set -gq menu-style "fg=#293040,bg=#f2f4fa"
set -gq menu-selected-style "fg=#e5eaf4,bg=#b14a07"
set -gq menu-border-style "fg=#95a5c4,bg=#f2f4fa"
