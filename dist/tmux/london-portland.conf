# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# London Portland for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#4a5469,bg=#c5d5f3"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#896800,#b14a07},bg=#c5d5f3]#[fg=#e0eafe,bg=#{?client_prefix,#896800,#b14a07},bold] #S #[fg=#{?client_prefix,#896800,#b14a07},bg=#c5d5f3,nobold] "
set -g status-right "#[fg=#4a5469,bg=#c5d5f3] %a %d %b #[fg=#1b202b,bg=#a1b7e5] %H:%M #[bg=#c5d5f3] #[fg=#9b211a]█#[fg=#b14a07]█#[fg=#896800]█#[fg=#0d8131]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#4a5469,bg=#c5d5f3"
set -g window-status-current-style "fg=#1b202b,bg=#a1b7e5"
set -g window-status-last-style "fg=#3c4557,bg=#c5d5f3"
set -g window-status-activity-style "fg=#b14a07,bg=#c5d5f3"
set -g window-status-bell-style "fg=#c92b23,bg=#c5d5f3,bold"
set -g window-status-format "#[fg=#697794,bg=#c5d5f3] #I #[fg=#4a5469]#W#{?window_zoomed_flag,#[fg=#896800] Z,} "
set -g window-status-current-format "#[fg=#e0eafe,bg=#896800,bold] #I #[fg=#1b202b,bg=#a1b7e5,nobold] #W#{?window_zoomed_flag,#[fg=#896800] Z,} #[bg=#c5d5f3]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#8fa5d0"
set -g pane-active-border-style "fg=#b14a07"
set -g display-panes-colour "#7f91b4"
set -g display-panes-active-colour "#b14a07"
set -gq display-panes-border-style "fg=#8fa5d0"
set -gq pane-scrollbars-style "fg=#7f91b4,bg=#c5d5f3,width=1,pad=0"
set -gq pane-status-style "fg=#4a5469,bg=#c5d5f3"
set -gq pane-status-current-style "fg=#1b202b,bg=#c5d5f3,underscore"
set -gq session-status-style "fg=#4a5469,bg=#c5d5f3"
set -gq session-status-current-style "fg=#1b202b,bg=#c5d5f3,underscore"
set -gq cursor-colour "#b14a07"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#1b202b,bg=#a1b7e5"
set -g message-command-style "fg=#896800,bg=#a1b7e5"
set -g mode-style "fg=#1b202b,bg=#a1b7e5"
set -gq copy-mode-match-style "fg=#1b202b,bg=#c6c3b2"
set -gq copy-mode-current-match-style "fg=#1b202b,bg=#c89a82,bold"
set -gq copy-mode-mark-style "fg=#e0eafe,bg=#7660ab"
set -gq copy-mode-selection-style "fg=#1b202b,bg=#a1b7e5"
set -gq copy-mode-position-style "fg=#e0eafe,bg=#b14a07"
set -gq copy-mode-line-number-style "fg=#7f91b4"
set -gq copy-mode-current-line-number-style "fg=#b14a07"
set -gq copy-mode-current-line-style "bg=#d4e0f6"
set -gq prompt-cursor-colour "#b14a07"
set -gq prompt-command-cursor-colour "#896800"
set -g clock-mode-colour "#896800"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#8fa5d0"
set -gq tree-mode-selection-style "fg=#1b202b,bg=#a1b7e5"
set -gq switch-mode-match-style "fg=#1b202b,bg=#c6c3b2,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#293040,bg=#f0f4fe"
set -gq popup-border-style "fg=#b14a07,bg=#f0f4fe"
set -gq menu-style "fg=#293040,bg=#f0f4fe"
set -gq menu-selected-style "fg=#e0eafe,bg=#b14a07"
set -gq menu-border-style "fg=#8fa5d0,bg=#f0f4fe"
