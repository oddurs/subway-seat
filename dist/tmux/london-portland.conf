# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# London Portland for tmux 3.2+. Options from newer releases are set with -q, so older tmux skips them.

# ── Status bar ─────────────────────────────────────────────────────────────
set -g status on
set -g status-justify left
set -g status-style "fg=#515459,bg=#ced5e3"
set -g status-left-style NONE
set -g status-right-style NONE
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#{?client_prefix,#896800,#9f591b},bg=#ced5e3]#[fg=#e5eaf6,bg=#{?client_prefix,#896800,#9f591b},bold] #S #[fg=#{?client_prefix,#896800,#9f591b},bg=#ced5e3,nobold] "
set -g status-right "#[fg=#515459,bg=#ced5e3] %a %d %b #[fg=#1f2022,bg=#adb7cb] %H:%M #[bg=#ced5e3] #[fg=#a40005]█#[fg=#9f591b]█#[fg=#896800]█#[fg=#357d41]█"

# ── Windows ────────────────────────────────────────────────────────────────
set -g window-status-separator ""
set -g window-status-style "fg=#515459,bg=#ced5e3"
set -g window-status-current-style "fg=#1f2022,bg=#adb7cb"
set -g window-status-last-style "fg=#434548,bg=#ced5e3"
set -g window-status-activity-style "fg=#9f591b,bg=#ced5e3"
set -g window-status-bell-style "fg=#ca2822,bg=#ced5e3,bold"
set -g window-status-format "#[fg=#727781,bg=#ced5e3] #I #[fg=#515459]#W#{?window_zoomed_flag,#[fg=#896800] Z,} "
set -g window-status-current-format "#[fg=#e5eaf6,bg=#896800,bold] #I #[fg=#1f2022,bg=#adb7cb,nobold] #W#{?window_zoomed_flag,#[fg=#896800] Z,} #[bg=#ced5e3]"

# ── Panes ──────────────────────────────────────────────────────────────────
set -g pane-border-style "fg=#9ba5b8"
set -g pane-active-border-style "fg=#9f591b"
set -g display-panes-colour "#8a919f"
set -g display-panes-active-colour "#9f591b"
set -gq display-panes-border-style "fg=#9ba5b8"
set -gq pane-scrollbars-style "fg=#8a919f,bg=#ced5e3,width=1,pad=0"
set -gq pane-status-style "fg=#515459,bg=#ced5e3"
set -gq pane-status-current-style "fg=#1f2022,bg=#ced5e3,underscore"
set -gq session-status-style "fg=#515459,bg=#ced5e3"
set -gq session-status-current-style "fg=#1f2022,bg=#ced5e3,underscore"
set -gq cursor-colour "#9f591b"

# ── Messages, prompts, copy mode ───────────────────────────────────────────
set -g message-style "fg=#1f2022,bg=#adb7cb"
set -g message-command-style "fg=#896800,bg=#adb7cb"
set -g mode-style "fg=#1f2022,bg=#adb7cb"
set -gq copy-mode-match-style "fg=#1f2022,bg=#c9c3ac"
set -gq copy-mode-current-match-style "fg=#1f2022,bg=#c2a288,bold"
set -gq copy-mode-mark-style "fg=#e5eaf6,bg=#7660ab"
set -gq copy-mode-selection-style "fg=#1f2022,bg=#adb7cb"
set -gq copy-mode-position-style "fg=#e5eaf6,bg=#9f591b"
set -gq copy-mode-line-number-style "fg=#8a919f"
set -gq copy-mode-current-line-number-style "fg=#9f591b"
set -gq copy-mode-current-line-style "bg=#d9e0ec"
set -gq prompt-cursor-colour "#9f591b"
set -gq prompt-command-cursor-colour "#896800"
set -g clock-mode-colour "#896800"

# ── Choose-tree and switch modes (tmux 3.6+) ───────────────────────────────
set -gq tree-mode-border-style "fg=#9ba5b8"
set -gq tree-mode-selection-style "fg=#1f2022,bg=#adb7cb"
set -gq switch-mode-match-style "fg=#1f2022,bg=#c9c3ac,bold"

# ── Popups and menus (tmux 3.3+ / 3.4+) ────────────────────────────────────
set -gq popup-style "fg=#2f3033,bg=#f2f4fa"
set -gq popup-border-style "fg=#9f591b,bg=#f2f4fa"
set -gq menu-style "fg=#2f3033,bg=#f2f4fa"
set -gq menu-selected-style "fg=#e5eaf6,bg=#9f591b"
set -gq menu-border-style "fg=#9ba5b8,bg=#f2f4fa"
