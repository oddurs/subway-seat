# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# London Portland for Midnight Commander. Needs mc 4.8.19+ built with S-Lang and a true-color
# terminal (COLORTERM=truecolor).

[skin]
    description = London Portland
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[aliases]
    Ground         = #E5EAF6
    Chrome         = #D9E0EC
    Groove         = #CED5E3
    Paper          = #F2F4FA
    Raised         = #ADB7CB
    Select         = #ADB7CB
    Ink            = #E5EAF6
    Text           = #2F3033
    Bright         = #1F2022
    Quiet          = #434548
    Muted          = #515459
    Faint          = #727781
    Fainter        = #8A919F
    Label          = #5D6168
    Gold           = #896800
    Orange         = #9F591B
    Red            = #A40005
    RedBright      = #CA2822
    Green          = #357D41
    Sage           = #007376
    Denim          = #0019A8
    Clay           = #7660AB
    OrangeBright   = #AE672B
    Search         = #C9C3AC
    SearchCurrent  = #C2A288
    DiffAdd        = #CADDCE
    DiffDelete     = #EDCCCD
    DiffChange     = #E0D8BD
    DiffChangeWord = #D9CFAD

[core]
    _default_ = Text;Ground
    selected = Bright;Select
    marked = Gold;;bold
    markselect = Gold;Select;bold
    gauge = ;Orange
    input = Text;Ground
    inputunchanged = Muted;Ground
    inputmark = Bright;Select
    disabled = Faint;Paper
    reverse = Bright;Raised
    commandlinemark = Bright;Select
    header = Orange;;bold
    inputhistory = Label;Paper
    commandhistory = Label;Ground
    shadow = Fainter;Groove

[dialog]
    _default_ = Text;Paper
    dfocus = Bright;Select
    dhotnormal = Orange;;underline
    dhotfocus = Orange;Select;underline
    dtitle = Gold;;bold

[error]
    _default_ = Ink;Red
    errdfocus = Red;Ink
    errdhotnormal = ;;underline
    errdhotfocus = Red;Ink;underline
    errdtitle = ;;bold

[filehighlight]
    directory = Gold;;bold
    executable = Green;;bold
    symlink = Sage;
    hardlink =
    stalelink = RedBright;
    device = OrangeBright;
    special = Clay;
    core = Red;
    temp = Fainter;
    archive = RedBright;
    doc = Denim;
    source = Sage;
    media = Orange;
    graph = Clay;
    database = OrangeBright;

[menu]
    _default_ = Quiet;Chrome
    menusel = Bright;Select
    menuhot = Orange;
    menuhotsel = Orange;Select
    menuinactive = Label;Chrome

[popupmenu]
    _default_ = Text;Paper
    menusel = Bright;Select
    menutitle = Gold;;bold

[buttonbar]
    hotkey = Orange;Chrome;bold
    button = Quiet;Chrome

[statusbar]
    _default_ = Quiet;Chrome

[help]
    _default_ = Text;Paper
    helpitalic = Green;;italic
    helpbold = Gold;;bold
    helplink = Denim;;underline
    helpslink = Ink;Denim
    helptitle = Orange;;bold

[editor]
    _default_ = Text;Ground
    editbold = Bright;Search;bold
    editmarked = Bright;Select
    editwhitespace = Fainter;Ground
    editnonprintable = Clay;Groove
    editlinestate = Fainter;Ground
    bookmark = Bright;Raised
    bookmarkfound = Bright;SearchCurrent
    editrightmargin = Fainter;Chrome
    editbg = ;Chrome
    editframe = Faint;
    editframeactive = Gold;
    editframedrag = Orange;

[viewer]
    _default_ = Text;Ground
    viewbold = Bright;;bold
    viewunderline = Sage;;underline
    viewselected = Bright;SearchCurrent

[diffviewer]
    added = Text;DiffAdd
    changedline = Text;DiffChange
    changednew = Bright;DiffChangeWord
    changed = ;DiffChange
    removed = ;DiffDelete
    error = Ink;Red

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ░

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
