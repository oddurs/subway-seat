# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Guimard for Midnight Commander. Needs mc 4.8.19+ built with S-Lang and a true-color
# terminal (COLORTERM=truecolor).

[skin]
    description = Paris Guimard
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[aliases]
    Ground         = #212D27
    Chrome         = #1A231E
    Groove         = #141A17
    Paper          = #2A3831
    Raised         = #34453C
    Select         = #42544B
    Ink            = #141A17
    Text           = #DAE0DC
    Bright         = #EAEEEC
    Quiet          = #C3CAC6
    Muted          = #ABB4AF
    Faint          = #77847D
    Fainter        = #5B6A62
    Label          = #929D97
    Gold           = #EBC168
    Orange         = #D0914F
    Red            = #CD6B63
    RedBright      = #E1837A
    Green          = #80C28E
    Sage           = #7BB096
    Denim          = #709BC8
    Clay           = #CE96B4
    OrangeBright   = #E7AB6D
    Search         = #5E593A
    SearchCurrent  = #785F3B
    DiffAdd        = #2C3F31
    DiffDelete     = #442F2B
    DiffChange     = #363524
    DiffChangeWord = #4C452C

[core]
    _default_ = Text;Ground
    selected = Bright;Select
    marked = Gold;;bold
    markselect = Gold;Select;bold
    gauge = ;Orange
    input = Text;Ground
    inputunchanged = Muted;Ground
    inputmark = Bright;Select
    disabled = Faint;Paper
    reverse = Bright;Raised
    commandlinemark = Bright;Select
    header = Orange;;bold
    inputhistory = Label;Paper
    commandhistory = Label;Ground
    shadow = Fainter;Groove

[dialog]
    _default_ = Text;Paper
    dfocus = Bright;Select
    dhotnormal = Orange;;underline
    dhotfocus = Orange;Select;underline
    dtitle = Gold;;bold

[error]
    _default_ = Ink;Red
    errdfocus = Red;Ink
    errdhotnormal = ;;underline
    errdhotfocus = Red;Ink;underline
    errdtitle = ;;bold

[filehighlight]
    directory = Gold;;bold
    executable = Green;;bold
    symlink = Sage;
    hardlink =
    stalelink = RedBright;
    device = OrangeBright;
    special = Clay;
    core = Red;
    temp = Fainter;
    archive = RedBright;
    doc = Denim;
    source = Sage;
    media = Orange;
    graph = Clay;
    database = OrangeBright;

[menu]
    _default_ = Quiet;Chrome
    menusel = Bright;Select
    menuhot = Orange;
    menuhotsel = Orange;Select
    menuinactive = Label;Chrome

[popupmenu]
    _default_ = Text;Paper
    menusel = Bright;Select
    menutitle = Gold;;bold

[buttonbar]
    hotkey = Orange;Chrome;bold
    button = Quiet;Chrome

[statusbar]
    _default_ = Quiet;Chrome

[help]
    _default_ = Text;Paper
    helpitalic = Green;;italic
    helpbold = Gold;;bold
    helplink = Denim;;underline
    helpslink = Ink;Denim
    helptitle = Orange;;bold

[editor]
    _default_ = Text;Ground
    editbold = Bright;Search;bold
    editmarked = Bright;Select
    editwhitespace = Fainter;Ground
    editnonprintable = Clay;Groove
    editlinestate = Fainter;Ground
    bookmark = Bright;Raised
    bookmarkfound = Bright;SearchCurrent
    editrightmargin = Fainter;Chrome
    editbg = ;Chrome
    editframe = Faint;
    editframeactive = Gold;
    editframedrag = Orange;

[viewer]
    _default_ = Text;Ground
    viewbold = Bright;;bold
    viewunderline = Sage;;underline
    viewselected = Bright;SearchCurrent

[diffviewer]
    added = Text;DiffAdd
    changedline = Text;DiffChange
    changednew = Bright;DiffChangeWord
    changed = ;DiffChange
    removed = ;DiffDelete
    error = Ink;Red

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ░

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
