# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Subway Seat for Midnight Commander. Needs mc 4.8.19+ built with S-Lang and a true-color
# terminal (COLORTERM=truecolor).

[skin]
    description = Subway Seat
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[aliases]
    Ground         = #362619
    Chrome         = #2A1D13
    Groove         = #20160E
    Paper          = #43301F
    Raised         = #513B27
    Select         = #634932
    Ink            = #20160E
    Text           = #EDDCBC
    Bright         = #F8ECD4
    Quiet          = #D9C6A3
    Muted          = #C4AE8C
    Faint          = #967B5C
    Fainter        = #7B6047
    Label          = #AE9575
    Gold           = #F3BF45
    Orange         = #EC7F31
    Red            = #E05C45
    RedBright      = #F97160
    Green          = #ADB956
    Sage           = #86AD95
    Denim          = #7F9BAE
    Clay           = #F4A87E
    OrangeBright   = #FF9D55
    Search         = #6F5426
    SearchCurrent  = #915225
    DiffAdd        = #3F3A1E
    DiffDelete     = #52281C
    DiffChange     = #423117
    DiffChangeWord = #57421C

[core]
    _default_ = Text;Ground
    selected = Bright;Select
    marked = Gold;;bold
    markselect = Gold;Select;bold
    gauge = ;Orange
    input = Text;Ground
    inputunchanged = Muted;Ground
    inputmark = Bright;Select
    disabled = Faint;Paper
    reverse = Bright;Raised
    commandlinemark = Bright;Select
    header = Orange;;bold
    inputhistory = Label;Paper
    commandhistory = Label;Ground
    shadow = Fainter;Groove

[dialog]
    _default_ = Text;Paper
    dfocus = Bright;Select
    dhotnormal = Orange;;underline
    dhotfocus = Orange;Select;underline
    dtitle = Gold;;bold

[error]
    _default_ = Ink;Red
    errdfocus = Red;Ink
    errdhotnormal = ;;underline
    errdhotfocus = Red;Ink;underline
    errdtitle = ;;bold

[filehighlight]
    directory = Gold;;bold
    executable = Green;;bold
    symlink = Sage;
    hardlink =
    stalelink = RedBright;
    device = OrangeBright;
    special = Clay;
    core = Red;
    temp = Fainter;
    archive = RedBright;
    doc = Denim;
    source = Sage;
    media = Orange;
    graph = Clay;
    database = OrangeBright;

[menu]
    _default_ = Quiet;Chrome
    menusel = Bright;Select
    menuhot = Orange;
    menuhotsel = Orange;Select
    menuinactive = Label;Chrome

[popupmenu]
    _default_ = Text;Paper
    menusel = Bright;Select
    menutitle = Gold;;bold

[buttonbar]
    hotkey = Orange;Chrome;bold
    button = Quiet;Chrome

[statusbar]
    _default_ = Quiet;Chrome

[help]
    _default_ = Text;Paper
    helpitalic = Green;;italic
    helpbold = Gold;;bold
    helplink = Denim;;underline
    helpslink = Ink;Denim
    helptitle = Orange;;bold

[editor]
    _default_ = Text;Ground
    editbold = Bright;Search;bold
    editmarked = Bright;Select
    editwhitespace = Fainter;Ground
    editnonprintable = Clay;Groove
    editlinestate = Fainter;Ground
    bookmark = Bright;Raised
    bookmarkfound = Bright;SearchCurrent
    editrightmargin = Fainter;Chrome
    editbg = ;Chrome
    editframe = Faint;
    editframeactive = Gold;
    editframedrag = Orange;

[viewer]
    _default_ = Text;Ground
    viewbold = Bright;;bold
    viewunderline = Sage;;underline
    viewselected = Bright;SearchCurrent

[diffviewer]
    added = Text;DiffAdd
    changedline = Text;DiffChange
    changednew = Bright;DiffChangeWord
    changed = ;DiffChange
    removed = ;DiffDelete
    error = Ink;Red

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ░

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
