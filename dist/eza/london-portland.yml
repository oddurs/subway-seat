# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# London Portland for eza 0.20+.
colourful: true
filekinds:
  normal: {foreground: "#293040"}
  directory: {foreground: "#896800", is_bold: true}
  symlink: {foreground: "#007376"}
  pipe: {foreground: "#7660AB"}
  block_device: {foreground: "#B86100", is_bold: true}
  char_device: {foreground: "#B86100"}
  socket: {foreground: "#7660AB", is_bold: true}
  special: {foreground: "#7660AB"}
  executable: {foreground: "#0D8131", is_bold: true}
  mount_point: {foreground: "#977300", is_bold: true, is_underline: true}
perms:
  user_read: {foreground: "#896800", is_bold: true}
  user_write: {foreground: "#B14A07", is_bold: true}
  user_execute_file: {foreground: "#0D8131", is_bold: true}
  user_execute_other: {foreground: "#0D8131", is_bold: true}
  group_read: {foreground: "#896800"}
  group_write: {foreground: "#B14A07"}
  group_execute: {foreground: "#0D8131"}
  other_read: {foreground: "#896800"}
  other_write: {foreground: "#B14A07"}
  other_execute: {foreground: "#0D8131"}
  special_user_file: {foreground: "#7660AB"}
  special_other: {foreground: "#697794"}
  attribute: {foreground: "#697794"}
size:
  major: {foreground: "#007376"}
  minor: {foreground: "#008688"}
  number_byte: {foreground: "#4A5469"}
  number_kilo: {foreground: "#0D8131"}
  number_mega: {foreground: "#896800"}
  number_giga: {foreground: "#B14A07"}
  number_huge: {foreground: "#C92B23"}
  unit_byte: {foreground: "#626B80"}
  unit_kilo: {foreground: "#2E9250"}
  unit_mega: {foreground: "#977C26"}
  unit_giga: {foreground: "#B9632C"}
  unit_huge: {foreground: "#CE4944"}
users:
  user_you: {foreground: "#896800"}
  user_root: {foreground: "#C92B23"}
  user_other: {foreground: "#4A5469"}
  group_yours: {foreground: "#3C4557"}
  group_other: {foreground: "#556179"}
  group_root: {foreground: "#C92B23"}
links:
  normal: {foreground: "#007376"}
  multi_link_file: {foreground: "#B14A07"}
git:
  new: {foreground: "#0D8131"}
  modified: {foreground: "#896800"}
  deleted: {foreground: "#C92B23"}
  renamed: {foreground: "#007376"}
  typechange: {foreground: "#7660AB"}
  ignored: {foreground: "#8192B4"}
  conflicted: {foreground: "#9B211A", is_bold: true}
git_repo:
  branch_main: {foreground: "#3C4557"}
  branch_other: {foreground: "#B14A07"}
  git_clean: {foreground: "#0D8131"}
  git_dirty: {foreground: "#896800"}
security_context:
  none: {foreground: "#697794"}
  selinux:
    colon: {foreground: "#8192B4"}
    user: {foreground: "#4A5469"}
    role: {foreground: "#007376"}
    typ: {foreground: "#556179"}
    range: {foreground: "#7660AB"}
file_type:
  image: {foreground: "#7660AB"}
  video: {foreground: "#B14A07"}
  music: {foreground: "#B86100"}
  lossless: {foreground: "#B86100", is_bold: true}
  crypto: {foreground: "#9B211A"}
  document: {foreground: "#0019A8"}
  compressed: {foreground: "#C92B23"}
  temp: {foreground: "#8192B4"}
  compiled: {foreground: "#697794"}
  build: {foreground: "#896800", is_underline: true}
  source: {foreground: "#007376"}
punctuation: {foreground: "#8192B4"}
date: {foreground: "#4A5469"}
inode: {foreground: "#697794"}
blocks: {foreground: "#697794"}
header: {foreground: "#3C4557", is_underline: true}
octal: {foreground: "#7660AB"}
flags: {foreground: "#556179"}
symlink_path: {foreground: "#4A5469"}
control_char: {foreground: "#7660AB"}
broken_symlink: {foreground: "#C92B23"}
broken_path_overlay: {is_underline: true}
filenames:
  "README.md": {filename: {foreground: "#977300", is_bold: true}}
  "README": {filename: {foreground: "#977300", is_bold: true}}
  "LICENSE": {filename: {foreground: "#556179"}}
extensions:
  lock: {filename: {foreground: "#697794"}}
  log: {filename: {foreground: "#697794"}}
