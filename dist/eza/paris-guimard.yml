# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Guimard for eza 0.20+.
colourful: true
filekinds:
  normal: {foreground: "#DAE0DC"}
  directory: {foreground: "#EBC168", is_bold: true}
  symlink: {foreground: "#7BB096"}
  pipe: {foreground: "#CE96B4"}
  block_device: {foreground: "#E7AB6D", is_bold: true}
  char_device: {foreground: "#E7AB6D"}
  socket: {foreground: "#CE96B4", is_bold: true}
  special: {foreground: "#CE96B4"}
  executable: {foreground: "#80C28E", is_bold: true}
  mount_point: {foreground: "#FBD380", is_bold: true, is_underline: true}
perms:
  user_read: {foreground: "#EBC168", is_bold: true}
  user_write: {foreground: "#D0914F", is_bold: true}
  user_execute_file: {foreground: "#80C28E", is_bold: true}
  user_execute_other: {foreground: "#80C28E", is_bold: true}
  group_read: {foreground: "#EBC168"}
  group_write: {foreground: "#D0914F"}
  group_execute: {foreground: "#80C28E"}
  other_read: {foreground: "#EBC168"}
  other_write: {foreground: "#D0914F"}
  other_execute: {foreground: "#80C28E"}
  special_user_file: {foreground: "#CE96B4"}
  special_other: {foreground: "#77847D"}
  attribute: {foreground: "#77847D"}
size:
  major: {foreground: "#7BB096"}
  minor: {foreground: "#98CCB2"}
  number_byte: {foreground: "#ABB4AF"}
  number_kilo: {foreground: "#80C28E"}
  number_mega: {foreground: "#EBC168"}
  number_giga: {foreground: "#D0914F"}
  number_huge: {foreground: "#E1837A"}
  unit_byte: {foreground: "#828C86"}
  unit_kilo: {foreground: "#64956F"}
  unit_mega: {foreground: "#AE9554"}
  unit_giga: {foreground: "#9C7343"}
  unit_huge: {foreground: "#A76961"}
users:
  user_you: {foreground: "#EBC168"}
  user_root: {foreground: "#E1837A"}
  user_other: {foreground: "#ABB4AF"}
  group_yours: {foreground: "#C3CAC6"}
  group_other: {foreground: "#929D97"}
  group_root: {foreground: "#E1837A"}
links:
  normal: {foreground: "#7BB096"}
  multi_link_file: {foreground: "#D0914F"}
git:
  new: {foreground: "#80C28E"}
  modified: {foreground: "#EBC168"}
  deleted: {foreground: "#E1837A"}
  renamed: {foreground: "#7BB096"}
  typechange: {foreground: "#CE96B4"}
  ignored: {foreground: "#5B6A62"}
  conflicted: {foreground: "#CD6B63", is_bold: true}
git_repo:
  branch_main: {foreground: "#C3CAC6"}
  branch_other: {foreground: "#D0914F"}
  git_clean: {foreground: "#80C28E"}
  git_dirty: {foreground: "#EBC168"}
security_context:
  none: {foreground: "#77847D"}
  selinux:
    colon: {foreground: "#5B6A62"}
    user: {foreground: "#ABB4AF"}
    role: {foreground: "#7BB096"}
    typ: {foreground: "#929D97"}
    range: {foreground: "#CE96B4"}
file_type:
  image: {foreground: "#CE96B4"}
  video: {foreground: "#D0914F"}
  music: {foreground: "#E7AB6D"}
  lossless: {foreground: "#E7AB6D", is_bold: true}
  crypto: {foreground: "#CD6B63"}
  document: {foreground: "#709BC8"}
  compressed: {foreground: "#E1837A"}
  temp: {foreground: "#5B6A62"}
  compiled: {foreground: "#77847D"}
  build: {foreground: "#EBC168", is_underline: true}
  source: {foreground: "#7BB096"}
punctuation: {foreground: "#5B6A62"}
date: {foreground: "#ABB4AF"}
inode: {foreground: "#77847D"}
blocks: {foreground: "#77847D"}
header: {foreground: "#C3CAC6", is_underline: true}
octal: {foreground: "#CE96B4"}
flags: {foreground: "#929D97"}
symlink_path: {foreground: "#ABB4AF"}
control_char: {foreground: "#CE96B4"}
broken_symlink: {foreground: "#E1837A"}
broken_path_overlay: {is_underline: true}
filenames:
  "README.md": {filename: {foreground: "#FBD380", is_bold: true}}
  "README": {filename: {foreground: "#FBD380", is_bold: true}}
  "LICENSE": {filename: {foreground: "#929D97"}}
extensions:
  lock: {filename: {foreground: "#77847D"}}
  log: {filename: {foreground: "#77847D"}}
