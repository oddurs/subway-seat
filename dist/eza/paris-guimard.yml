# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Guimard for eza 0.20+.
colourful: true
filekinds:
  normal: {foreground: "#D9E1DB"}
  directory: {foreground: "#F2BF4B", is_bold: true}
  symlink: {foreground: "#5FA09D"}
  pipe: {foreground: "#CE96B4"}
  block_device: {foreground: "#E7AB6D", is_bold: true}
  char_device: {foreground: "#E7AB6D"}
  socket: {foreground: "#CE96B4", is_bold: true}
  special: {foreground: "#CE96B4"}
  executable: {foreground: "#80C28E", is_bold: true}
  mount_point: {foreground: "#FFD273", is_bold: true, is_underline: true}
perms:
  user_read: {foreground: "#F2BF4B", is_bold: true}
  user_write: {foreground: "#D0914F", is_bold: true}
  user_execute_file: {foreground: "#80C28E", is_bold: true}
  user_execute_other: {foreground: "#80C28E", is_bold: true}
  group_read: {foreground: "#F2BF4B"}
  group_write: {foreground: "#D0914F"}
  group_execute: {foreground: "#80C28E"}
  other_read: {foreground: "#F2BF4B"}
  other_write: {foreground: "#D0914F"}
  other_execute: {foreground: "#80C28E"}
  special_user_file: {foreground: "#CE96B4"}
  special_other: {foreground: "#74857C"}
  attribute: {foreground: "#74857C"}
size:
  major: {foreground: "#5FA09D"}
  minor: {foreground: "#8CCCC9"}
  number_byte: {foreground: "#A9B5AE"}
  number_kilo: {foreground: "#80C28E"}
  number_mega: {foreground: "#F2BF4B"}
  number_giga: {foreground: "#D0914F"}
  number_huge: {foreground: "#EE8F85"}
  unit_byte: {foreground: "#7F8C85"}
  unit_kilo: {foreground: "#63966F"}
  unit_mega: {foreground: "#B29440"}
  unit_giga: {foreground: "#9B7343"}
  unit_huge: {foreground: "#B07268"}
users:
  user_you: {foreground: "#F2BF4B"}
  user_root: {foreground: "#EE8F85"}
  user_other: {foreground: "#A9B5AE"}
  group_yours: {foreground: "#C2CBC5"}
  group_other: {foreground: "#909E96"}
  group_root: {foreground: "#EE8F85"}
links:
  normal: {foreground: "#5FA09D"}
  multi_link_file: {foreground: "#D0914F"}
git:
  new: {foreground: "#80C28E"}
  modified: {foreground: "#F2BF4B"}
  deleted: {foreground: "#EE8F85"}
  renamed: {foreground: "#5FA09D"}
  typechange: {foreground: "#CE96B4"}
  ignored: {foreground: "#586B61"}
  conflicted: {foreground: "#CD6B63", is_bold: true}
git_repo:
  branch_main: {foreground: "#C2CBC5"}
  branch_other: {foreground: "#D0914F"}
  git_clean: {foreground: "#80C28E"}
  git_dirty: {foreground: "#F2BF4B"}
security_context:
  none: {foreground: "#74857C"}
  selinux:
    colon: {foreground: "#586B61"}
    user: {foreground: "#A9B5AE"}
    role: {foreground: "#5FA09D"}
    typ: {foreground: "#909E96"}
    range: {foreground: "#CE96B4"}
file_type:
  image: {foreground: "#CE96B4"}
  video: {foreground: "#D0914F"}
  music: {foreground: "#E7AB6D"}
  lossless: {foreground: "#E7AB6D", is_bold: true}
  crypto: {foreground: "#CD6B63"}
  document: {foreground: "#709BC8"}
  compressed: {foreground: "#EE8F85"}
  temp: {foreground: "#586B61"}
  compiled: {foreground: "#74857C"}
  build: {foreground: "#F2BF4B", is_underline: true}
  source: {foreground: "#5FA09D"}
punctuation: {foreground: "#586B61"}
date: {foreground: "#A9B5AE"}
inode: {foreground: "#74857C"}
blocks: {foreground: "#74857C"}
header: {foreground: "#C2CBC5", is_underline: true}
octal: {foreground: "#CE96B4"}
flags: {foreground: "#909E96"}
symlink_path: {foreground: "#A9B5AE"}
control_char: {foreground: "#CE96B4"}
broken_symlink: {foreground: "#EE8F85"}
broken_path_overlay: {is_underline: true}
filenames:
  "README.md": {filename: {foreground: "#FFD273", is_bold: true}}
  "README": {filename: {foreground: "#FFD273", is_bold: true}}
  "LICENSE": {filename: {foreground: "#909E96"}}
extensions:
  lock: {filename: {foreground: "#74857C"}}
  log: {filename: {foreground: "#74857C"}}
