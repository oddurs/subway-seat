# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Subway Seat Enamel for eza 0.20+.
colourful: true
filekinds:
  normal: {foreground: "#3E2C1E"}
  directory: {foreground: "#936200", is_bold: true}
  symlink: {foreground: "#3E7157"}
  pipe: {foreground: "#863913"}
  block_device: {foreground: "#C4561A", is_bold: true}
  char_device: {foreground: "#C4561A"}
  socket: {foreground: "#863913", is_bold: true}
  special: {foreground: "#863913"}
  executable: {foreground: "#66740F", is_bold: true}
  mount_point: {foreground: "#A56E00", is_bold: true, is_underline: true}
perms:
  user_read: {foreground: "#936200", is_bold: true}
  user_write: {foreground: "#AD4E00", is_bold: true}
  user_execute_file: {foreground: "#66740F", is_bold: true}
  user_execute_other: {foreground: "#66740F", is_bold: true}
  group_read: {foreground: "#936200"}
  group_write: {foreground: "#AD4E00"}
  group_execute: {foreground: "#66740F"}
  other_read: {foreground: "#936200"}
  other_write: {foreground: "#AD4E00"}
  other_execute: {foreground: "#66740F"}
  special_user_file: {foreground: "#863913"}
  special_other: {foreground: "#8C7254"}
  attribute: {foreground: "#8C7254"}
size:
  major: {foreground: "#3E7157"}
  minor: {foreground: "#4C8367"}
  number_byte: {foreground: "#654F3B"}
  number_kilo: {foreground: "#66740F"}
  number_mega: {foreground: "#936200"}
  number_giga: {foreground: "#AD4E00"}
  number_huge: {foreground: "#BC4031"}
  unit_byte: {foreground: "#7A6652"}
  unit_kilo: {foreground: "#7B862D"}
  unit_mega: {foreground: "#A27620"}
  unit_giga: {foreground: "#B86520"}
  unit_huge: {foreground: "#C45949"}
users:
  user_you: {foreground: "#936200"}
  user_root: {foreground: "#BC4031"}
  user_other: {foreground: "#654F3B"}
  group_yours: {foreground: "#54402F"}
  group_other: {foreground: "#735C44"}
  group_root: {foreground: "#BC4031"}
links:
  normal: {foreground: "#3E7157"}
  multi_link_file: {foreground: "#AD4E00"}
git:
  new: {foreground: "#66740F"}
  modified: {foreground: "#936200"}
  deleted: {foreground: "#BC4031"}
  renamed: {foreground: "#3E7157"}
  typechange: {foreground: "#863913"}
  ignored: {foreground: "#A58C6A"}
  conflicted: {foreground: "#992418", is_bold: true}
git_repo:
  branch_main: {foreground: "#54402F"}
  branch_other: {foreground: "#AD4E00"}
  git_clean: {foreground: "#66740F"}
  git_dirty: {foreground: "#936200"}
security_context:
  none: {foreground: "#8C7254"}
  selinux:
    colon: {foreground: "#A58C6A"}
    user: {foreground: "#654F3B"}
    role: {foreground: "#3E7157"}
    typ: {foreground: "#735C44"}
    range: {foreground: "#863913"}
file_type:
  image: {foreground: "#863913"}
  video: {foreground: "#AD4E00"}
  music: {foreground: "#C4561A"}
  lossless: {foreground: "#C4561A", is_bold: true}
  crypto: {foreground: "#992418"}
  document: {foreground: "#3F6480"}
  compressed: {foreground: "#BC4031"}
  temp: {foreground: "#A58C6A"}
  compiled: {foreground: "#8C7254"}
  build: {foreground: "#936200", is_underline: true}
  source: {foreground: "#3E7157"}
punctuation: {foreground: "#A58C6A"}
date: {foreground: "#654F3B"}
inode: {foreground: "#8C7254"}
blocks: {foreground: "#8C7254"}
header: {foreground: "#54402F", is_underline: true}
octal: {foreground: "#863913"}
flags: {foreground: "#735C44"}
symlink_path: {foreground: "#654F3B"}
control_char: {foreground: "#863913"}
broken_symlink: {foreground: "#BC4031"}
broken_path_overlay: {is_underline: true}
filenames:
  "README.md": {filename: {foreground: "#A56E00", is_bold: true}}
  "README": {filename: {foreground: "#A56E00", is_bold: true}}
  "LICENSE": {filename: {foreground: "#735C44"}}
extensions:
  lock: {filename: {foreground: "#8C7254"}}
  log: {filename: {foreground: "#8C7254"}}
