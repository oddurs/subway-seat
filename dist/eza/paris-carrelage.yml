# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Carrelage for eza 0.20+.
colourful: true
filekinds:
  normal: {foreground: "#25352C"}
  directory: {foreground: "#8A6700", is_bold: true}
  symlink: {foreground: "#277555"}
  pipe: {foreground: "#9A557D"}
  block_device: {foreground: "#AE6800", is_bold: true}
  char_device: {foreground: "#AE6800"}
  socket: {foreground: "#9A557D", is_bold: true}
  special: {foreground: "#9A557D"}
  executable: {foreground: "#18803F", is_bold: true}
  mount_point: {foreground: "#997300", is_bold: true, is_underline: true}
perms:
  user_read: {foreground: "#8A6700", is_bold: true}
  user_write: {foreground: "#9B5D00", is_bold: true}
  user_execute_file: {foreground: "#18803F", is_bold: true}
  user_execute_other: {foreground: "#18803F", is_bold: true}
  group_read: {foreground: "#8A6700"}
  group_write: {foreground: "#9B5D00"}
  group_execute: {foreground: "#18803F"}
  other_read: {foreground: "#8A6700"}
  other_write: {foreground: "#9B5D00"}
  other_execute: {foreground: "#18803F"}
  special_user_file: {foreground: "#9A557D"}
  special_other: {foreground: "#627F70"}
  attribute: {foreground: "#627F70"}
size:
  major: {foreground: "#277555"}
  minor: {foreground: "#3D8666"}
  number_byte: {foreground: "#45594F"}
  number_kilo: {foreground: "#18803F"}
  number_mega: {foreground: "#8A6700"}
  number_giga: {foreground: "#9B5D00"}
  number_huge: {foreground: "#BB403B"}
  unit_byte: {foreground: "#5D6F66"}
  unit_kilo: {foreground: "#379058"}
  unit_mega: {foreground: "#987B23"}
  unit_giga: {foreground: "#A67323"}
  unit_huge: {foreground: "#C15A55"}
users:
  user_you: {foreground: "#8A6700"}
  user_root: {foreground: "#BB403B"}
  user_other: {foreground: "#45594F"}
  group_yours: {foreground: "#374940"}
  group_other: {foreground: "#4F675B"}
  group_root: {foreground: "#BB403B"}
links:
  normal: {foreground: "#277555"}
  multi_link_file: {foreground: "#9B5D00"}
git:
  new: {foreground: "#18803F"}
  modified: {foreground: "#8A6700"}
  deleted: {foreground: "#BB403B"}
  renamed: {foreground: "#277555"}
  typechange: {foreground: "#9A557D"}
  ignored: {foreground: "#7B9989"}
  conflicted: {foreground: "#9E171B", is_bold: true}
git_repo:
  branch_main: {foreground: "#374940"}
  branch_other: {foreground: "#9B5D00"}
  git_clean: {foreground: "#18803F"}
  git_dirty: {foreground: "#8A6700"}
security_context:
  none: {foreground: "#627F70"}
  selinux:
    colon: {foreground: "#7B9989"}
    user: {foreground: "#45594F"}
    role: {foreground: "#277555"}
    typ: {foreground: "#4F675B"}
    range: {foreground: "#9A557D"}
file_type:
  image: {foreground: "#9A557D"}
  video: {foreground: "#9B5D00"}
  music: {foreground: "#AE6800"}
  lossless: {foreground: "#AE6800", is_bold: true}
  crypto: {foreground: "#9E171B"}
  document: {foreground: "#27629C"}
  compressed: {foreground: "#BB403B"}
  temp: {foreground: "#7B9989"}
  compiled: {foreground: "#627F70"}
  build: {foreground: "#8A6700", is_underline: true}
  source: {foreground: "#277555"}
punctuation: {foreground: "#7B9989"}
date: {foreground: "#45594F"}
inode: {foreground: "#627F70"}
blocks: {foreground: "#627F70"}
header: {foreground: "#374940", is_underline: true}
octal: {foreground: "#9A557D"}
flags: {foreground: "#4F675B"}
symlink_path: {foreground: "#45594F"}
control_char: {foreground: "#9A557D"}
broken_symlink: {foreground: "#BB403B"}
broken_path_overlay: {is_underline: true}
filenames:
  "README.md": {filename: {foreground: "#997300", is_bold: true}}
  "README": {filename: {foreground: "#997300", is_bold: true}}
  "LICENSE": {filename: {foreground: "#4F675B"}}
extensions:
  lock: {filename: {foreground: "#627F70"}}
  log: {filename: {foreground: "#627F70"}}
