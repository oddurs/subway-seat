# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Subway Seat Enamel flavor for Yazi.

[app]
overall = { bg = "#F4E9D4" }

[mgr]
cwd             = { fg = "#936200" }
find_keyword    = { fg = "#936200", bold = true, italic = true, underline = true }
find_position   = { fg = "#AD4E00", bg = "reset", bold = true, italic = true }
symlink_target  = { fg = "#3E7157", italic = true }
marker_copied   = { fg = "#66740F", bg = "#66740F" }
marker_cut      = { fg = "#BC4031", bg = "#BC4031" }
marker_marked   = { fg = "#3E7157", bg = "#3E7157" }
marker_selected = { fg = "#936200", bg = "#936200" }
count_copied    = { fg = "#F4E9D4", bg = "#66740F" }
count_cut       = { fg = "#F4E9D4", bg = "#BC4031" }
count_selected  = { fg = "#F4E9D4", bg = "#936200" }
border_style    = { fg = "#BAA07A" }

[tabs]
active   = { fg = "#F4E9D4", bg = "#AD4E00", bold = true }
inactive = { fg = "#54402F", bg = "#CAB48E" }

[mode]
normal_main = { fg = "#F4E9D4", bg = "#AD4E00", bold = true }
normal_alt  = { fg = "#AD4E00", bg = "#D9C8A7" }
select_main = { fg = "#F4E9D4", bg = "#66740F", bold = true }
select_alt  = { fg = "#66740F", bg = "#D9C8A7" }
unset_main  = { fg = "#F4E9D4", bg = "#BC4031", bold = true }
unset_alt   = { fg = "#BC4031", bg = "#D9C8A7" }

[indicator]
parent  = { fg = "#2A1D13", bg = "#CAB48E" }
current = { fg = "#F4E9D4", bg = "#936200" }
preview = { fg = "#2A1D13", bg = "#CAB48E" }

[status]
perm_sep        = { fg = "#A58C6A" }
perm_type       = { fg = "#3E7157" }
perm_read       = { fg = "#936200" }
perm_write      = { fg = "#AD4E00" }
perm_exec       = { fg = "#66740F" }
progress_label  = { fg = "#2A1D13", bold = true }
progress_normal = { fg = "#66740F", bg = "#CAB48E" }
progress_error  = { fg = "#BC4031", bg = "#CAB48E" }

[which]
border          = { fg = "#AD4E00" }
mask            = { bg = "#EBDEC6" }
cand            = { fg = "#936200" }
rest            = { fg = "#8C7254" }
desc            = { fg = "#54402F" }
separator_style = { fg = "#BAA07A" }

[confirm]
border  = { fg = "#AD4E00" }
title   = { fg = "#AD4E00", bold = true }
body    = {}
list    = {}
btn_yes = { fg = "#F4E9D4", bg = "#AD4E00", bold = true }
btn_no  = { fg = "#54402F" }

[spot]
border   = { fg = "#AD4E00" }
title    = { fg = "#AD4E00" }
tbl_col  = { fg = "#3E7157" }
tbl_cell = { fg = "#F4E9D4", bg = "#936200" }

[notify]
title_info  = { fg = "#3F6480" }
title_warn  = { fg = "#936200" }
title_error = { fg = "#BC4031" }

[pick]
border   = { fg = "#AD4E00" }
active   = { fg = "#AD4E00", bold = true }
inactive = {}

[input]
border   = { fg = "#AD4E00" }
title    = {}
value    = {}
selected = { fg = "#2A1D13", bg = "#CAB48E" }

[cmp]
border   = { fg = "#AD4E00" }
active   = { fg = "#2A1D13", bg = "#CAB48E" }
inactive = {}

[tasks]
border  = { fg = "#AD4E00" }
title   = {}
hovered = { fg = "#AD4E00", bold = true }

[help]
border  = { fg = "#AD4E00" }
chord   = { fg = "#936200" }
action  = { fg = "#54402F" }
hovered = { bg = "#CAB48E", bold = true }

[filetype]
rules = [
	# Media
	{ mime = "**/image/*", fg = "#A65633" },
	{ mime = "**/{audio,video}/*", fg = "#AD4E00" },
	# Archives
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#BC4031" },
	# Documents
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#3F6480" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#A58C6A" },
	# Special files
	{ url = "*", is = "orphan", bg = "#992418" },
	{ url = "*", is = "exec", fg = "#66740F" },
	# Dummy files
	{ url = "*", is = "dummy", bg = "#992418" },
	{ url = "*/", is = "dummy", bg = "#992418" },
	# Fallback
	{ url = "*/", fg = "#936200", bold = true },
]

[icon]
dirs = [
	{ name = ".config", text = "", fg = "#936200" },
	{ name = ".git", text = "", fg = "#936200" },
	{ name = ".github", text = "", fg = "#936200" },
	{ name = ".npm", text = "", fg = "#936200" },
	{ name = "Desktop", text = "", fg = "#936200" },
	{ name = "Development", text = "", fg = "#936200" },
	{ name = "Documents", text = "", fg = "#936200" },
	{ name = "Downloads", text = "", fg = "#936200" },
	{ name = "Library", text = "", fg = "#936200" },
	{ name = "Movies", text = "", fg = "#936200" },
	{ name = "Music", text = "", fg = "#936200" },
	{ name = "Pictures", text = "", fg = "#936200" },
	{ name = "Public", text = "", fg = "#936200" },
	{ name = "Videos", text = "", fg = "#936200" },
]
conds = [
	{ if = "orphan", text = "", fg = "#BC4031" },
	{ if = "link", text = "", fg = "#3E7157" },
	{ if = "block", text = "", fg = "#A65633" },
	{ if = "char", text = "", fg = "#A65633" },
	{ if = "fifo", text = "", fg = "#A65633" },
	{ if = "sock", text = "", fg = "#A65633" },
	{ if = "sticky", text = "", fg = "#A65633" },
	{ if = "dummy", text = "", fg = "#BC4031" },
	{ if = "dir & hovered", text = "", fg = "#936200" },
	{ if = "dir", text = "", fg = "#936200" },
	{ if = "exec", text = "", fg = "#66740F" },
	{ if = "!dir", text = "", fg = "#54402F" },
]
