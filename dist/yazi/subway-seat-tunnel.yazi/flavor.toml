# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Subway Seat Tunnel flavor for Yazi.

[app]
overall = { bg = "#24180E" }

[mgr]
cwd             = { fg = "#F3BF45" }
find_keyword    = { fg = "#F3BF45", bold = true, italic = true, underline = true }
find_position   = { fg = "#EC7F31", bg = "reset", bold = true, italic = true }
symlink_target  = { fg = "#86AD95", italic = true }
marker_copied   = { fg = "#A3AE4B", bg = "#A3AE4B" }
marker_cut      = { fg = "#EC6A50", bg = "#EC6A50" }
marker_marked   = { fg = "#86AD95", bg = "#86AD95" }
marker_selected = { fg = "#F3BF45", bg = "#F3BF45" }
count_copied    = { fg = "#140D07", bg = "#A3AE4B" }
count_cut       = { fg = "#140D07", bg = "#EC6A50" }
count_selected  = { fg = "#140D07", bg = "#F3BF45" }
border_style    = { fg = "#4F3927" }

[tabs]
active   = { fg = "#140D07", bg = "#EC7F31", bold = true }
inactive = { fg = "#D6C3A0", bg = "#3D2C1D" }

[mode]
normal_main = { fg = "#140D07", bg = "#EC7F31", bold = true }
normal_alt  = { fg = "#EC7F31", bg = "#302115" }
select_main = { fg = "#140D07", bg = "#A3AE4B", bold = true }
select_alt  = { fg = "#A3AE4B", bg = "#302115" }
unset_main  = { fg = "#140D07", bg = "#EC6A50", bold = true }
unset_alt   = { fg = "#EC6A50", bg = "#302115" }

[indicator]
parent  = { fg = "#F6EAD1", bg = "#3D2C1D" }
current = { fg = "#140D07", bg = "#F3BF45" }
preview = { fg = "#F6EAD1", bg = "#3D2C1D" }

[status]
perm_sep        = { fg = "#6A523C" }
perm_type       = { fg = "#86AD95" }
perm_read       = { fg = "#F3BF45" }
perm_write      = { fg = "#EC7F31" }
perm_exec       = { fg = "#A3AE4B" }
progress_label  = { fg = "#F6EAD1", bold = true }
progress_normal = { fg = "#A3AE4B", bg = "#3D2C1D" }
progress_error  = { fg = "#EC6A50", bg = "#3D2C1D" }

[which]
border          = { fg = "#EC7F31" }
mask            = { bg = "#1B120A" }
cand            = { fg = "#F3BF45" }
rest            = { fg = "#8A7053" }
desc            = { fg = "#D6C3A0" }
separator_style = { fg = "#4F3927" }

[confirm]
border  = { fg = "#EC7F31" }
title   = { fg = "#EC7F31", bold = true }
body    = {}
list    = {}
btn_yes = { fg = "#140D07", bg = "#EC7F31", bold = true }
btn_no  = { fg = "#D6C3A0" }

[spot]
border   = { fg = "#EC7F31" }
title    = { fg = "#EC7F31" }
tbl_col  = { fg = "#86AD95" }
tbl_cell = { fg = "#140D07", bg = "#F3BF45" }

[notify]
title_info  = { fg = "#7F9BAE" }
title_warn  = { fg = "#F3BF45" }
title_error = { fg = "#EC6A50" }

[pick]
border   = { fg = "#EC7F31" }
active   = { fg = "#EC7F31", bold = true }
inactive = {}

[input]
border   = { fg = "#EC7F31" }
title    = {}
value    = {}
selected = { fg = "#F6EAD1", bg = "#4F3927" }

[cmp]
border   = { fg = "#EC7F31" }
active   = { fg = "#F6EAD1", bg = "#3D2C1D" }
inactive = {}

[tasks]
border  = { fg = "#EC7F31" }
title   = {}
hovered = { fg = "#EC7F31", bold = true }

[help]
border  = { fg = "#EC7F31" }
chord   = { fg = "#F3BF45" }
action  = { fg = "#D6C3A0" }
hovered = { bg = "#3D2C1D", bold = true }

[filetype]
rules = [
	# Media
	{ mime = "**/image/*", fg = "#E0956C" },
	{ mime = "**/{audio,video}/*", fg = "#EC7F31" },
	# Archives
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#EC6A50" },
	# Documents
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#7F9BAE" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#6A523C" },
	# Special files
	{ url = "*", is = "orphan", bg = "#D2503A" },
	{ url = "*", is = "exec", fg = "#A3AE4B" },
	# Dummy files
	{ url = "*", is = "dummy", bg = "#D2503A" },
	{ url = "*/", is = "dummy", bg = "#D2503A" },
	# Fallback
	{ url = "*/", fg = "#F3BF45", bold = true },
]

[icon]
dirs = [
	{ name = ".config", text = "", fg = "#F3BF45" },
	{ name = ".git", text = "", fg = "#F3BF45" },
	{ name = ".github", text = "", fg = "#F3BF45" },
	{ name = ".npm", text = "", fg = "#F3BF45" },
	{ name = "Desktop", text = "", fg = "#F3BF45" },
	{ name = "Development", text = "", fg = "#F3BF45" },
	{ name = "Documents", text = "", fg = "#F3BF45" },
	{ name = "Downloads", text = "", fg = "#F3BF45" },
	{ name = "Library", text = "", fg = "#F3BF45" },
	{ name = "Movies", text = "", fg = "#F3BF45" },
	{ name = "Music", text = "", fg = "#F3BF45" },
	{ name = "Pictures", text = "", fg = "#F3BF45" },
	{ name = "Public", text = "", fg = "#F3BF45" },
	{ name = "Videos", text = "", fg = "#F3BF45" },
]
conds = [
	{ if = "orphan", text = "", fg = "#EC6A50" },
	{ if = "link", text = "", fg = "#86AD95" },
	{ if = "block", text = "", fg = "#E0956C" },
	{ if = "char", text = "", fg = "#E0956C" },
	{ if = "fifo", text = "", fg = "#E0956C" },
	{ if = "sock", text = "", fg = "#E0956C" },
	{ if = "sticky", text = "", fg = "#E0956C" },
	{ if = "dummy", text = "", fg = "#EC6A50" },
	{ if = "dir & hovered", text = "", fg = "#F3BF45" },
	{ if = "dir", text = "", fg = "#F3BF45" },
	{ if = "exec", text = "", fg = "#A3AE4B" },
	{ if = "!dir", text = "", fg = "#D6C3A0" },
]
