# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Subway Seat Tunnel for bottom. Key names use the 0.10 spelling, which later releases accept too.

[styles.cpu]
all_entry_color = "#E9D8B6"
avg_entry_color = "#EC7F31"
cpu_core_colors = ["#A3AE4B", "#F3BF45", "#EC7F31", "#EC6A50", "#86AD95", "#E0956C", "#BFCB63", "#FFD36B"]

[styles.memory]
ram_color = "#A3AE4B"
cache_color = "#86AD95"
swap_color = "#EC7F31"
arc_color = "#E0956C"
gpu_colors = ["#F3BF45", "#EC7F31", "#EC6A50", "#86AD95", "#E0956C", "#BFCB63"]

[styles.network]
rx_color = "#A3AE4B"
tx_color = "#EC7F31"
rx_total_color = "#BFCB63"
tx_total_color = "#FF9D55"

[styles.battery]
high_battery_color = "#A3AE4B"
medium_battery_color = "#F3BF45"
low_battery_color = "#EC6A50"

[styles.tables]
headers = { color = "#EC7F31", bold = true }

[styles.graphs]
graph_color = "#6A523C"
legend_text = { color = "#C0AA88" }

[styles.widgets]
border_color = "#4F3927"
selected_border_color = "#EC7F31"
widget_title = { color = "#F3BF45" }
text = { color = "#E9D8B6" }
selected_text = { color = "#140D07", bg_color = "#EC7F31" }
disabled_text = { color = "#6A523C" }
thread_text = { color = "#86AD95" }  # 0.11+

# Newer sections (bottom 0.13+); older releases ignore them.
[styles.temp_graph]
temp_graph_color_styles = ["#A3AE4B", "#F3BF45", "#EC7F31", "#EC6A50", "#86AD95", "#E0956C", "#BFCB63", "#FFD36B"]

[styles.disk_io_graph]
read_colours = ["#A3AE4B", "#86AD95", "#BFCB63", "#A5C9B0"]
write_colours = ["#EC7F31", "#E0956C", "#FF9D55", "#EC6A50"]
