# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Subway Seat Enamel for bottom. Key names use the 0.10 spelling, which later releases accept too.

[styles.cpu]
all_entry_color = "#3E2C1E"
avg_entry_color = "#C4561A"
cpu_core_colors = ["#697813", "#A56E00", "#C4561A", "#C44A33", "#3E7157", "#AE5F3A", "#7B8B22", "#BA8210"]

[styles.memory]
ram_color = "#697813"
cache_color = "#3E7157"
swap_color = "#C4561A"
arc_color = "#AE5F3A"
gpu_colors = ["#A56E00", "#C4561A", "#C44A33", "#3E7157", "#AE5F3A", "#7B8B22"]

[styles.network]
rx_color = "#697813"
tx_color = "#C4561A"
rx_total_color = "#7B8B22"
tx_total_color = "#D66A27"

[styles.battery]
high_battery_color = "#697813"
medium_battery_color = "#A56E00"
low_battery_color = "#C44A33"

[styles.tables]
headers = { color = "#C4561A", bold = true }

[styles.graphs]
graph_color = "#A58C6A"
legend_text = { color = "#654F3B" }

[styles.widgets]
border_color = "#BAA07A"
selected_border_color = "#C4561A"
widget_title = { color = "#A56E00" }
text = { color = "#3E2C1E" }
selected_text = { color = "#F4E9D4", bg_color = "#C4561A" }
disabled_text = { color = "#A58C6A" }
thread_text = { color = "#3E7157" }  # 0.11+

# Newer sections (bottom 0.13+); older releases ignore them.
[styles.temp_graph]
temp_graph_color_styles = ["#697813", "#A56E00", "#C4561A", "#C44A33", "#3E7157", "#AE5F3A", "#7B8B22", "#BA8210"]

[styles.disk_io_graph]
read_colours = ["#697813", "#3E7157", "#7B8B22", "#4C8367"]
write_colours = ["#C4561A", "#AE5F3A", "#D66A27", "#C44A33"]
