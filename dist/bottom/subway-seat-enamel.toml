# >>> subway-seat >>>
# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Subway Seat Enamel for bottom. Key names use the 0.10 spelling, which later releases accept too.

[styles.cpu]
all_entry_color = "#3E2C1E"
avg_entry_color = "#AD4E00"
cpu_core_colors = ["#66740F", "#936200", "#AD4E00", "#BC4031", "#3E7157", "#863913", "#697813", "#A56E00"]

[styles.memory]
ram_color = "#66740F"
cache_color = "#3E7157"
swap_color = "#AD4E00"
arc_color = "#863913"
gpu_colors = ["#936200", "#AD4E00", "#BC4031", "#3E7157", "#863913", "#697813"]

[styles.network]
rx_color = "#66740F"
tx_color = "#AD4E00"
rx_total_color = "#697813"
tx_total_color = "#C4561A"

[styles.battery]
high_battery_color = "#66740F"
medium_battery_color = "#936200"
low_battery_color = "#BC4031"

[styles.tables]
headers = { color = "#AD4E00", bold = true }

[styles.graphs]
graph_color = "#A58C6A"
legend_text = { color = "#654F3B" }

[styles.widgets]
border_color = "#BAA07A"
selected_border_color = "#AD4E00"
widget_title = { color = "#936200" }
text = { color = "#3E2C1E" }
selected_text = { color = "#F4E9D4", bg_color = "#AD4E00" }
disabled_text = { color = "#A58C6A" }
thread_text = { color = "#3E7157" }  # 0.11+

# Newer sections (bottom 0.13+); older releases ignore them.
[styles.temp_graph]
temp_graph_color_styles = ["#66740F", "#936200", "#AD4E00", "#BC4031", "#3E7157", "#863913", "#697813", "#A56E00"]

[styles.disk_io_graph]
read_colours = ["#66740F", "#3E7157", "#697813", "#4C8367"]
write_colours = ["#AD4E00", "#863913", "#C4561A", "#BC4031"]
# <<< subway-seat <<<
