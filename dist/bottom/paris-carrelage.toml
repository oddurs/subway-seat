# >>> subway-seat >>>
# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Carrelage for bottom. Key names use the 0.10 spelling, which later releases accept too.

[styles.cpu]
all_entry_color = "#2A342B"
avg_entry_color = "#804B00"
cpu_core_colors = ["#207F41", "#8E6B08", "#804B00", "#BE423D", "#006E6B", "#98547C", "#168540", "#9D770A"]

[styles.memory]
ram_color = "#207F41"
cache_color = "#006E6B"
swap_color = "#804B00"
arc_color = "#98547C"
gpu_colors = ["#8E6B08", "#804B00", "#BE423D", "#006E6B", "#98547C", "#168540"]

[styles.network]
rx_color = "#207F41"
tx_color = "#804B00"
rx_total_color = "#168540"
tx_total_color = "#A26100"

[styles.battery]
high_battery_color = "#207F41"
medium_battery_color = "#8E6B08"
low_battery_color = "#BE423D"

[styles.tables]
headers = { color = "#804B00", bold = true }

[styles.graphs]
graph_color = "#879887"
legend_text = { color = "#4C574D" }

[styles.widgets]
border_color = "#9BAC9A"
selected_border_color = "#804B00"
widget_title = { color = "#8E6B08" }
text = { color = "#2A342B" }
selected_text = { color = "#EEF3ED", bg_color = "#804B00" }
disabled_text = { color = "#879887" }
thread_text = { color = "#006E6B" }  # 0.11+

# Newer sections (bottom 0.13+); older releases ignore them.
[styles.temp_graph]
temp_graph_color_styles = ["#207F41", "#8E6B08", "#804B00", "#BE423D", "#006E6B", "#98547C", "#168540", "#9D770A"]

[styles.disk_io_graph]
read_colours = ["#207F41", "#006E6B", "#168540", "#1E8683"]
write_colours = ["#804B00", "#98547C", "#A26100", "#BE423D"]
# <<< subway-seat <<<
