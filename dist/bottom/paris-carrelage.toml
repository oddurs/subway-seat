# >>> subway-seat >>>
# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Carrelage for bottom. Key names use the 0.10 spelling, which later releases accept too.

[styles.cpu]
all_entry_color = "#21352D"
avg_entry_color = "#9B5D00"
cpu_core_colors = ["#00823B", "#856A00", "#9B5D00", "#C82C2C", "#007752", "#B43586", "#00863D", "#937500"]

[styles.memory]
ram_color = "#00823B"
cache_color = "#007752"
swap_color = "#9B5D00"
arc_color = "#B43586"
gpu_colors = ["#856A00", "#9B5D00", "#C82C2C", "#007752", "#B43586", "#00863D"]

[styles.network]
rx_color = "#00823B"
tx_color = "#9B5D00"
rx_total_color = "#00863D"
tx_total_color = "#AE6800"

[styles.battery]
high_battery_color = "#00823B"
medium_battery_color = "#856A00"
low_battery_color = "#C82C2C"

[styles.tables]
headers = { color = "#9B5D00", bold = true }

[styles.graphs]
graph_color = "#759A8A"
legend_text = { color = "#405B4F" }

[styles.widgets]
border_color = "#88AF9E"
selected_border_color = "#9B5D00"
widget_title = { color = "#856A00" }
text = { color = "#21352D" }
selected_text = { color = "#E2EDE8", bg_color = "#9B5D00" }
disabled_text = { color = "#759A8A" }
thread_text = { color = "#007752" }  # 0.11+

# Newer sections (bottom 0.13+); older releases ignore them.
[styles.temp_graph]
temp_graph_color_styles = ["#00823B", "#856A00", "#9B5D00", "#C82C2C", "#007752", "#B43586", "#00863D", "#937500"]

[styles.disk_io_graph]
read_colours = ["#00823B", "#007752", "#00863D", "#2A8862"]
write_colours = ["#9B5D00", "#B43586", "#AE6800", "#C82C2C"]
# <<< subway-seat <<<
