# >>> subway-seat >>>
# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Catacombes for bottom. Key names use the 0.10 spelling, which later releases accept too.

[styles.cpu]
all_entry_color = "#D5DCD8"
avg_entry_color = "#D0914F"
cpu_core_colors = ["#80C28E", "#EBC168", "#D0914F", "#E1837A", "#7BB096", "#CE96B4", "#8FD59E", "#FBD380"]

[styles.memory]
ram_color = "#80C28E"
cache_color = "#7BB096"
swap_color = "#D0914F"
arc_color = "#CE96B4"
gpu_colors = ["#EBC168", "#D0914F", "#E1837A", "#7BB096", "#CE96B4", "#8FD59E"]

[styles.network]
rx_color = "#80C28E"
tx_color = "#D0914F"
rx_total_color = "#8FD59E"
tx_total_color = "#E7AB6D"

[styles.battery]
high_battery_color = "#80C28E"
medium_battery_color = "#EBC168"
low_battery_color = "#E1837A"

[styles.tables]
headers = { color = "#D0914F", bold = true }

[styles.graphs]
graph_color = "#57645D"
legend_text = { color = "#A7B0AB" }

[styles.widgets]
border_color = "#34423B"
selected_border_color = "#D0914F"
widget_title = { color = "#EBC168" }
text = { color = "#D5DCD8" }
selected_text = { color = "#0B100D", bg_color = "#D0914F" }
disabled_text = { color = "#57645D" }
thread_text = { color = "#7BB096" }  # 0.11+

# Newer sections (bottom 0.13+); older releases ignore them.
[styles.temp_graph]
temp_graph_color_styles = ["#80C28E", "#EBC168", "#D0914F", "#E1837A", "#7BB096", "#CE96B4", "#8FD59E", "#FBD380"]

[styles.disk_io_graph]
read_colours = ["#80C28E", "#7BB096", "#8FD59E", "#98CCB2"]
write_colours = ["#D0914F", "#CE96B4", "#E7AB6D", "#E1837A"]
# <<< subway-seat <<<
