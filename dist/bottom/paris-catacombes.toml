# >>> subway-seat >>>
# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# Paris Catacombes for bottom. Key names use the 0.10 spelling, which later releases accept too.

[styles.cpu]
all_entry_color = "#D4DDD7"
avg_entry_color = "#D0914F"
cpu_core_colors = ["#80C28E", "#F2BF4B", "#D0914F", "#E1837A", "#6CA087", "#CE96B4", "#8FD59E", "#FFD273"]

[styles.memory]
ram_color = "#80C28E"
cache_color = "#6CA087"
swap_color = "#D0914F"
arc_color = "#CE96B4"
gpu_colors = ["#F2BF4B", "#D0914F", "#E1837A", "#6CA087", "#CE96B4", "#8FD59E"]

[styles.network]
rx_color = "#80C28E"
tx_color = "#D0914F"
rx_total_color = "#8FD59E"
tx_total_color = "#E7AB6D"

[styles.battery]
high_battery_color = "#80C28E"
medium_battery_color = "#F2BF4B"
low_battery_color = "#E1837A"

[styles.tables]
headers = { color = "#D0914F", bold = true }

[styles.graphs]
graph_color = "#54655C"
legend_text = { color = "#A5B1AA" }

[styles.widgets]
border_color = "#31433A"
selected_border_color = "#D0914F"
widget_title = { color = "#F2BF4B" }
text = { color = "#D4DDD7" }
selected_text = { color = "#0A100D", bg_color = "#D0914F" }
disabled_text = { color = "#54655C" }
thread_text = { color = "#6CA087" }  # 0.11+

# Newer sections (bottom 0.13+); older releases ignore them.
[styles.temp_graph]
temp_graph_color_styles = ["#80C28E", "#F2BF4B", "#D0914F", "#E1837A", "#6CA087", "#CE96B4", "#8FD59E", "#FFD273"]

[styles.disk_io_graph]
read_colours = ["#80C28E", "#6CA087", "#8FD59E", "#98CCB2"]
write_colours = ["#D0914F", "#CE96B4", "#E7AB6D", "#E1837A"]
# <<< subway-seat <<<
