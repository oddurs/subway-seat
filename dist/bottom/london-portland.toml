# >>> subway-seat >>>
# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# London Portland for bottom. Key names use the 0.10 spelling, which later releases accept too.

[styles.cpu]
all_entry_color = "#2F3033"
avg_entry_color = "#9F591B"
cpu_core_colors = ["#357D41", "#896800", "#9F591B", "#CA2822", "#007376", "#7660AB", "#398145", "#977300"]

[styles.memory]
ram_color = "#357D41"
cache_color = "#007376"
swap_color = "#9F591B"
arc_color = "#7660AB"
gpu_colors = ["#896800", "#9F591B", "#CA2822", "#007376", "#7660AB", "#398145"]

[styles.network]
rx_color = "#357D41"
tx_color = "#9F591B"
rx_total_color = "#398145"
tx_total_color = "#AE672B"

[styles.battery]
high_battery_color = "#357D41"
medium_battery_color = "#896800"
low_battery_color = "#CA2822"

[styles.tables]
headers = { color = "#9F591B", bold = true }

[styles.graphs]
graph_color = "#8A919F"
legend_text = { color = "#515459" }

[styles.widgets]
border_color = "#9BA5B8"
selected_border_color = "#9F591B"
widget_title = { color = "#896800" }
text = { color = "#2F3033" }
selected_text = { color = "#E5EAF6", bg_color = "#9F591B" }
disabled_text = { color = "#8A919F" }
thread_text = { color = "#007376" }  # 0.11+

# Newer sections (bottom 0.13+); older releases ignore them.
[styles.temp_graph]
temp_graph_color_styles = ["#357D41", "#896800", "#9F591B", "#CA2822", "#007376", "#7660AB", "#398145", "#977300"]

[styles.disk_io_graph]
read_colours = ["#357D41", "#007376", "#398145", "#008689"]
write_colours = ["#9F591B", "#7660AB", "#AE672B", "#CA2822"]
# <<< subway-seat <<<
