# >>> subway-seat >>>
# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# London Portland for bottom. Key names use the 0.10 spelling, which later releases accept too.

[styles.cpu]
all_entry_color = "#293040"
avg_entry_color = "#B14A07"
cpu_core_colors = ["#0D8131", "#896800", "#B14A07", "#C92B23", "#007376", "#7660AB", "#008730", "#977300"]

[styles.memory]
ram_color = "#0D8131"
cache_color = "#007376"
swap_color = "#B14A07"
arc_color = "#7660AB"
gpu_colors = ["#896800", "#B14A07", "#C92B23", "#007376", "#7660AB", "#008730"]

[styles.network]
rx_color = "#0D8131"
tx_color = "#B14A07"
rx_total_color = "#008730"
tx_total_color = "#B86100"

[styles.battery]
high_battery_color = "#0D8131"
medium_battery_color = "#896800"
low_battery_color = "#C92B23"

[styles.tables]
headers = { color = "#B14A07", bold = true }

[styles.graphs]
graph_color = "#8192B4"
legend_text = { color = "#4A5469" }

[styles.widgets]
border_color = "#93A7CF"
selected_border_color = "#B14A07"
widget_title = { color = "#896800" }
text = { color = "#293040" }
selected_text = { color = "#E8F0FF", bg_color = "#B14A07" }
disabled_text = { color = "#8192B4" }
thread_text = { color = "#007376" }  # 0.11+

# Newer sections (bottom 0.13+); older releases ignore them.
[styles.temp_graph]
temp_graph_color_styles = ["#0D8131", "#896800", "#B14A07", "#C92B23", "#007376", "#7660AB", "#008730", "#977300"]

[styles.disk_io_graph]
read_colours = ["#0D8131", "#007376", "#008730", "#008688"]
write_colours = ["#B14A07", "#7660AB", "#B86100", "#C92B23"]
# <<< subway-seat <<<
