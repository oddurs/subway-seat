# >>> subway-seat >>>
# Subway Seat — generated from palette.py by build.py. Edit the palette, not this file.
# London Portland for bottom. Key names use the 0.10 spelling, which later releases accept too.

[styles.cpu]
all_entry_color = "#293040"
avg_entry_color = "#A45600"
cpu_core_colors = ["#00822E", "#896800", "#A45600", "#C92B23", "#007376", "#7660AB", "#008730", "#977300"]

[styles.memory]
ram_color = "#00822E"
cache_color = "#007376"
swap_color = "#A45600"
arc_color = "#7660AB"
gpu_colors = ["#896800", "#A45600", "#C92B23", "#007376", "#7660AB", "#008730"]

[styles.network]
rx_color = "#00822E"
tx_color = "#A45600"
rx_total_color = "#008730"
tx_total_color = "#B86100"

[styles.battery]
high_battery_color = "#00822E"
medium_battery_color = "#896800"
low_battery_color = "#C92B23"

[styles.tables]
headers = { color = "#A45600", bold = true }

[styles.graphs]
graph_color = "#8291AE"
legend_text = { color = "#4A5469" }

[styles.widgets]
border_color = "#95A5C4"
selected_border_color = "#A45600"
widget_title = { color = "#896800" }
text = { color = "#293040" }
selected_text = { color = "#E5EAF4", bg_color = "#A45600" }
disabled_text = { color = "#8291AE" }
thread_text = { color = "#007376" }  # 0.11+

# Newer sections (bottom 0.13+); older releases ignore them.
[styles.temp_graph]
temp_graph_color_styles = ["#00822E", "#896800", "#A45600", "#C92B23", "#007376", "#7660AB", "#008730", "#977300"]

[styles.disk_io_graph]
read_colours = ["#00822E", "#007376", "#008730", "#008688"]
write_colours = ["#A45600", "#7660AB", "#B86100", "#C92B23"]
# <<< subway-seat <<<
