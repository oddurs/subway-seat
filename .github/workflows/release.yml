name: Release

# Push a tag like v0.3.0 (see docs/RELEASE.md, "Cutting a release"). CI runs in full, then
# this checks the tag against pyproject.toml and CHANGELOG.md, drafts a GitHub release with
# the downloadable files, and publishes to the VS Code Marketplace and Open VSX when their
# tokens are set. Review the draft and publish it by hand.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release and upload its assets
    env:
      HAS_VSCE: ${{ secrets.VSCE_PAT != '' }}
      HAS_OVSX: ${{ secrets.OVSX_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
          enable-cache: false # no cache restores in a job that publishes

      - name: The tag matches the version
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"
            exit 1
          fi
          if ! grep -Eq "^## \[$version\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [$version] - YYYY-MM-DD' section"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: dist/ matches the tag
        run: uv run ./build.py --check

      - name: Bundle
        run: |
          mkdir release
          zip -qr "release/subway-seat-$VERSION-dist.zip" dist
          cp dist/vscode/subway-seat.vsix "release/subway-seat-$VERSION.vsix"
          cp dist/jetbrains/*.jar dist/firefox/*.xpi release/
          ls -l release

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md" > notes.md; fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Subway Seat $GITHUB_REF_NAME" --notes-file notes.md release/*

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.HAS_VSCE == 'true' || env.HAS_OVSX == 'true'
        with:
          node-version: 22
          package-manager-cache: false

      # VSCE_PAT stops working when Azure DevOps retires global PATs (December 1, 2026).
      # docs/RELEASE.md §7 has the plan to move this step to Entra ID (azure/login + --azure-credential).
      - name: VS Code Marketplace
        if: env.HAS_VSCE == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3.9.2 publish --packagePath dist/vscode/subway-seat.vsix

      - name: Open VSX
        if: env.HAS_OVSX == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.2.0 publish dist/vscode/subway-seat.vsix --pat "$OVSX_PAT"
