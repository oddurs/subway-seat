name: Something looks wrong
description: A color that's off, a key that doesn't apply, a file that won't load.
labels: ["bug"]
body:
  - type: input
    id: port
    attributes:
      label: Port
      description: The app, as it's named on the site or in dist/.
      placeholder: "VS Code"
    validations:
      required: true
  - type: dropdown
    id: flavor
    attributes:
      label: Flavor
      multiple: true
      options:
        - Subway Seat (Walnut)
        - Subway Seat Tunnel
        - Subway Seat Enamel
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "VS Code 1.104.0"
  - type: textarea
    id: what
    attributes:
      label: What you see, and what you expected
      description: A screenshot is worth a thousand hex codes.
    validations:
      required: true
